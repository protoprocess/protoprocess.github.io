  h += '<span class="badge b-' + n + '">' + quand + '</span></div>';

  h += '<div class="l2">';
  h += '<span class="pastille p-' + (x.sans_responsable ? 'orange' : 'vert') + '">'
     + (x.sans_responsable ? 'personne' : esc(x.resp_nom || x.responsable)) + '</span>';
  if (x.sourdine) h += '<span class="pastille p-bleu">réponse client attendue</span>';
  h += '<span class="quoi">reçu le ' + frDate(x.recu_le) + ' — ' + esc(x.geste) + '</span>';

  h += '<span class="acts">';
  if (x.sans_responsable) {
    h += '<button class="btn-s" onclick="prendreDemande(\'' + esc(x.thread_id) + '\')">Je la prends</button>';
  }
  h += '<a class="btn-s" target="_blank" rel="noopener" href="' + esc(x.lien) + '">Ouvrir le mail</a>';
  h += '</span></div></div>';
  return h;
}

async function prendreDemande(thread_id) {
  try {
    const r = await fetch(DEMANDE_PRENDRE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify({ thread_id: thread_id, qui: MOI }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    const rep = await r.json();
    if (!rep.ok) throw new Error(rep.motif || 'refusé');
    toast('C est à toi. La demande arrive sur ton tableau.');
    const ligne = document.getElementById('dp-' + thread_id);
    if (ligne) { ligne.classList.add('parti'); setTimeout(chargerDemandes, 450); }
    else chargerDemandes();
  } catch (e) {
    toast('Pas enregistré : ' + e.message);
  }
}

/* ---------- commandes fournisseur : la date de livraison ---------- *
 * But du bloc (Olivier, 30/10/2026) : récupérer la DATE DE LIVRAISON du fournisseur,
 * pour l inscrire et la confronter à la date promise au client. La liste n est que ce
 * qui reste quand l automatique n a pas suffi.
 *
 * Rien n est jamais inscrit sans validation : « pas de règle, ça dépend du fournisseur,
 * mais 95% des cas un PDF oui ». La date lue dans le PDF est une PROPOSITION — une lecture
 * imparfaite n a donc aucune conséquence.
 *
 * Étape 1 (livrée) : on détecte, on propose, on valide. La date validée reste dans la base.
 * Étape 2 (à venir) : elle part dans la sheet achat et en colonne L du planning
 *                     (« Date recept cpts »), et se compare à la Date ARC de la colonne C.
 * ------------------------------------------------------------------ */
const AR_LIRE    = 'https://protoprocess.app.n8n.cloud/webhook/pp-ar-liste';
const AR_VALIDER = 'https://protoprocess.app.n8n.cloud/webhook/pp-ar-valider';

function voitLesAchats() {
  // La production en est depuis le 02/11/2026 : une commande rattachée à une affaire est
  // désormais visible par son responsable ET par Fred, qui la verra arriver à l'atelier.
  const p = POLE_DE[MOI];
  return p === 'direction' || p === 'commercial_achats' || p === 'production';
}

// Le ménage des P.O. sans affaire reste à la direction et à Fred : c'est une corvée, pas
// la peine d'en charger l'écran des autres.
// v1.20 (02/11/2026) : Fred en est. Décision Olivier — depuis que l'appli P.O. note son
// émetteur, il ne reste ici que les P.O. saisis à la main dans Odoo, dont personne ne sait
// à qui ils sont. Maura et Dorian n'ont pas à les porter.
function voitLeMenagePo() { return POLE_DE[MOI] === 'direction' || MOI === 'FR'; }

async function chargerAR() {
  const z = document.getElementById('bloc-ar');
  if (!z) return;
  z.innerHTML = '<div class="msg"><i class="ti ti-loader"></i> Lecture des accusés de réception…</div>';
  try {
    // Chacun ne voit que les commandes des affaires dont il est responsable au planning
    // (colonne N). Les PO sans affaire identifiée — usinage, consommables, outillage —
    // vont à la direction, seule en mesure de les suivre.
    const r = await fetch(AR_LIRE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                     body: JSON.stringify({ source: 'ma-gestion-de-projets', version: APP_VERSION,
                                                            qui: MOI, direction: POLE_DE[MOI] === 'direction' }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    z.innerHTML = blocAR(await r.json());
  } catch (e) {
    z.innerHTML = '<div class="msg err">Les accusés de réception n ont pas pu être lus (' + esc(e.message)
                + '). Le reste de la page est à jour.</div>';
  }
}

function blocAR(d) {
  const avec = (d && d.avec_ar) || [];
  const sans = (d && d.sans_ar) || [];
  const n = avec.length + sans.length;
  let h = entete(avec.length ? 't-crit' : 't-ok', '', 'COMMANDES FOURNISSEUR — DATE DE LIVRAISON', n, '');
  if (!n) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Toutes les commandes ont leur date.</div>';
    return h;
  }
  if (avec.length) h += capper(avec.map(ligneAR), 'commande');
  if (sans.length) {
    h += capper(sans.map(ligneAR), 'commande');
  }
  return h;
}

function ligneAR(a) {
  // confiance : sure (une date collée à un mot de livraison) · floue (plusieurs dates, ou un
  // délai en semaines) · aucune (PDF illisible, ou seulement des dates de commande et de devis)
  const niv = a.ar_trouve ? (a.date_lue ? 'bleu' : 'orange') : (a.age_j > 5 ? 'orange' : 'gris');
  let h = '<div class="row ' + niv + '">';
  h += '<div class="l1"><span class="so">' + esc(a.po_name) + '</span>';
  if (a.fournisseur) h += '<span class="sep">·</span><span class="cli">' + esc(a.fournisseur) + '</span>';
  h += '<span class="badge b-' + niv + '">' + (a.ar_trouve ? 'AR reçu le ' + frDate(a.ar_le)
                                                           : 'commandé il y a ' + a.age_j + ' j') + '</span></div>';

  h += '<div class="l2">';
  if (a.ar_trouve && a.date_lue) {
    h += '<span class="pastille p-bleu">livraison lue : ' + frDate(a.date_lue) + '</span>';
    if (a.confiance !== 'sure') h += '<span class="pastille p-orange">à vérifier</span>';
    h += '<span class="quoi">à confirmer avant de l inscrire</span>';
  } else if (a.ar_trouve) {
    h += '<span class="pastille p-orange">date illisible</span>';
    h += '<span class="quoi">l AR est là, mais la date n a pas pu en être tirée</span>';
  } else {
    h += '<span class="pastille p-' + niv + '">pas d AR</span>';
    h += '<span class="quoi">Tu en as reçu un ? Si oui, livraison prévue quand ?</span>';
  }
  // Un PO peut servir plusieurs affaires (AB Broker en sert trois). On le dit sur la ligne :
  // la commande est unique, donc la date l est aussi, et une seule validation suffit.
  if (a.affaires && a.affaires.length > 1)
    h += '<span class="pastille p-gris">' + a.affaires.length + ' affaires</span>';
  h += '<span class="acts">';
  h += '<input type="date" id="d-' + esc(a.po_name) + '" value="' + esc(a.date_lue || '') + '">';
  h += '<button class="btn-p" onclick="deciderAR(\'' + esc(a.po_name) + '\',\'valider\')">Inscrire</button>';
  h += '<button class="btn-s" onclick="deciderAR(\'' + esc(a.po_name) + '\',\'eteindre\')">Déjà reçu</button>';
  h += '<button class="btn-s" onclick="plier(this)">Détail</button>';
  h += '</span></div>';

  h += '<div class="detail">';
  if (a.affaires && a.affaires.length) h += '<div class="refs">pour ' + a.affaires.map(esc).join(' · ') + '</div>';
  else h += '<div class="refs">aucune affaire rattachée — achat hors dossier</div>';
  if (a.piece_jointe) h += '<div class="refs">pièce jointe : ' + esc(a.piece_jointe) + '</div>';
  if (a.extrait) h += '<div class="refs">' + esc(a.extrait) + '</div>';
  if (a.commande_le) h += '<div class="refs">commandé le ' + frDate(a.commande_le) + '</div>';
  // Quand plusieurs personnes portent les affaires d un même PO, elles voient toutes la ligne.
  // Mieux vaut le dire que de laisser quelqu un chercher pourquoi elle a disparu de son écran.
  const autres = (a.responsables || []).filter(r => r !== MOI);
  if (autres.length)
    h += '<div class="refs">cette commande sert aussi ' + autres.map(esc).join(' et ')
       + ' — la première date inscrite vaut pour tout le monde</div>';
  h += '<div class="geste">La date inscrite ici part en colonne L du planning, sur le lot en cours '
     + 'de chaque affaire, et se compare à la date promise au client. Une case déjà remplie à la '
     + 'main n est jamais écrasée.</div>';
  h += '<div class="acts2"><button class="btn-s" onclick="deciderAR(\'' + esc(a.po_name) + '\',\'ignorer\')">'
     + 'Laisser de côté</button></div>';
  h += '</div></div>';
  return h;
}

async function deciderAR(po, geste) {
  const ch = document.getElementById('d-' + po);
  const date = ch ? ch.value : '';
  if (geste === 'valider' && !date) { toast('Il manque la date'); return; }
  try {
    const r = await fetch(AR_VALIDER, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ po_name: po, geste: geste, date: date }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    toast(geste === 'valider' ? 'Date retenue pour ' + po : po + ' retiré de la liste');
    chargerAR();
  } catch (e) {
    toast('Pas enregistré : ' + e.message);
  }
}

/* ---------- AR client : la date promise ---------- *
 * L AR client, c est l accusé qu ON envoie AU client avec la date promise — à ne pas
 * confondre avec l AR fournisseur, juste au-dessus, qui est l accusé qu on REÇOIT.
 *
 * Ce n est pas un champ Odoo, c est un message. Et la mesure du 02/11/2026 a montré que
 * l équipe n utilise PAS le modèle « PROTO PROCESS - Commande <SO> » : elle RÉPOND dans
 * le fil du bon de commande du client (« Re: URGENT : Commande achat - P2700189 »).
 * Les deux signaux comptent donc. Avec le seul modèle Odoo, le bloc annonçait 76
 * commandes sans AR ; avec les deux, il en reste 49 — et 36 étaient MERIO et QUOBLY.
 *
 * Les 25 MERIO ont été sorties à l ouverture : leur AR est bien parti, hors Odoo
 * (Olivier, 02/11/2026).
 *
 * Trois gestes, et aucun ne ment :
 *   AR envoyé   la ligne ne revient plus ; c est une déclaration humaine, elle gagne
 *               sur le balayage
 *   En attente  on attend une date (fournisseur) avant de s engager — la ligne revient
 *               au bout de 7 jours. Une mise en attente sans retour serait un oubli déguisé
 *   Odoo        pour envoyer l AR depuis la commande
 * ------------------------------------------------------------------ */
const ARCLIENT_LIRE  = 'https://protoprocess.app.n8n.cloud/webhook/pp-arclient-liste';
const ARCLIENT_GESTE = 'https://protoprocess.app.n8n.cloud/webhook/pp-arclient-geste';

async function chargerArClient() {
  const z = document.getElementById('bloc-arclient');
  if (!z) return;
  z.innerHTML = '<div class="msg"><i class="ti ti-loader"></i> Lecture des accusés client…</div>';
  try {
    const r = await fetch(ARCLIENT_LIRE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                           body: JSON.stringify({ source: 'ma-gestion-de-projets', version: APP_VERSION,
                                                                  qui: MOI, direction: POLE_DE[MOI] === 'direction' }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    z.innerHTML = blocArClient(await r.json());
  } catch (e) {
    z.innerHTML = '<div class="msg err">Les accusés client n ont pas pu être lus (' + esc(e.message)
                + '). Le reste de la page est à jour.</div>';
  }
}

function blocArClient(d) {
  const l = (d && d.lignes) || [];
  // Au-delà de 5 jours ouvrés, le client attend sa date depuis une semaine : c est le moment
  // où le silence commence à coûter.
  const chaud = l.some(x => Number(x.jours_ouvres) > 5);
  let h = entete(chaud ? 't-crit' : l.length ? 't-crit' : 't-ok', '', 'AR CLIENT MANQUANT', l.length, '');
  if (!l.length) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Tous les clients ont leur accusé.</div>';
    return h;
  }
  return h + capper(l.map(ligneArClient), 'commande');
}

function ligneArClient(x) {
  const j = Number(x.jours_ouvres || 0);
  // v1.31 : un TROISIEME cran. La ligne n avait que gris et ambre, si bien qu un client qui
  // attend son accusé depuis trois semaines se lisait comme un qui attend depuis six jours.
  // Seuil rouge : 8 jours ouvrés, soit plus de deux semaines de calendrier sans un mot.
  const niv = j > 8 ? 'rouge' : j > 5 ? 'orange' : 'gris';
  let h = '<div class="row ' + niv + '" id="ac-' + esc(x.so) + '">';
  h += '<div class="l1"><span class="so">' + esc(x.so) + '</span>';
  if (x.client) h += '<span class="sep">·</span><span class="cli">' + esc(x.client) + '</span>';
  h += '<span class="badge b-' + niv + '">' + j + ' j ouvrés</span></div>';

  h += '<div class="l2"><span class="pastille p-' + niv + '">'
     + (x.revenue ? 'attente terminée' : 'pas d accusé envoyé') + '</span>';
  h += '<span class="quoi">confirmée le ' + frDate(x.confirme_le)
     + (x.revenue ? ' · remise en attente le ' + frDate(x.attente_jusqu_au) : '') + '</span>';
  h += '<span class="acts">';
  if (x.lien_odoo) h += '<a class="btn-p" target="_blank" rel="noopener" href="' + esc(x.lien_odoo) + '">Odoo</a>';
  h += '<button class="btn-s" onclick="gesteArClient(\'' + esc(x.so) + '\',\'envoye\')">AR envoyé</button>';
  h += '<button class="btn-s" onclick="gesteArClient(\'' + esc(x.so) + '\',\'attente\')">En attente</button>';
  h += '</span></div></div>';
  return h;
}

async function gesteArClient(so, geste) {
  try {
    const r = await fetch(ARCLIENT_GESTE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ so: so, geste: geste, qui: MOI }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    toast(geste === 'envoye' ? 'AR noté pour ' + so : so + ' revient dans 7 jours');
    const ligne = document.getElementById('ac-' + so);
    if (ligne) { ligne.classList.add('parti'); setTimeout(chargerArClient, 450); }
    else chargerArClient();
  } catch (e) {
    toast('Pas enregistré : ' + e.message);
  }
}

/* ---------- P.O. sans affaire : à rattacher ---------- *
 * D'où ça vient (02/11/2026) : la règle du 30/10 envoyait à la direction tout P.O. dont
 * l'affaire était inconnue, au motif que « personne d'autre n'est en mesure de les suivre ».
 * À l'usage, Olivier voyait 17 lignes dont 13 étrangères, sans pouvoir rien en faire.
 *
 * L'erreur était dans le mot : ces commandes ne sont pas « sans affaire », leur affaire est
 * INCONNUE — parce qu'elles ont été créées à la main dans Odoo au lieu de passer par l'appli
 * P.O. Un PCB appartient forcément à un dossier ; c'est juste que rien ne le dit nulle part.
 * Vérifié dans Odoo le 02/11 : le champ « Document d'origine » est vide sur les 13.
 *
 * Donc on demande, une fois, et on retient :
 *   un SO              -> le P.O. part chez le responsable de l'affaire, ET chez Fred
 *   consommable de prod -> il part chez Fred et Stéphane, sans affaire
 *
 * Le responsable n'est jamais deviné : il est lu en colonne N du planning. Si le SO n'y est
 * pas, ou si la colonne est vide, le service REFUSE d'écrire et le dit.
 * ------------------------------------------------------------------ */
const PO_LIRE      = 'https://protoprocess.app.n8n.cloud/webhook/pp-po-liste';
const PO_RATTACHER = 'https://protoprocess.app.n8n.cloud/webhook/pp-po-rattacher';

async function chargerPoRattacher() {
  const z = document.getElementById('bloc-po-rattacher');
  if (!z) return;
  try {
    const r = await fetch(PO_LIRE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                     body: JSON.stringify({ source: 'ma-gestion-de-projets',
                                                            version: APP_VERSION, qui: MOI }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    z.innerHTML = blocPoRattacher(await r.json());
  } catch (e) {
    z.innerHTML = '<div class="msg err">Les P.O. à rattacher n ont pas pu être lus ('
                + esc(e.message) + '). Le reste de la page est à jour.</div>';
  }
}

function blocPoRattacher(d) {
  const l = (d && d.pos) || [];
  let h = entete(l.length ? 't-crit' : 't-ok', '', 'P.O. SANS AFFAIRE — À RATTACHER', l.length, '');
  if (!l.length) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Toutes les commandes savent à quelle affaire elles appartiennent.</div>';
    return h;
  }
  h += '<div class="dater">Ces commandes ont été créées à la main dans Odoo : rien ne dit à quelle '
     + 'affaire elles appartiennent. Dis-le une fois — elles partent chez leur responsable et chez Fred, '
     + 'et ne reviennent plus ici.</div>';
  h += capper(l.map(lignePoRattacher), 'P.O.');
  return h;
}

// L'identifiant du champ de saisie ne peut pas porter le tiret du nom du P.O. : on le retire.
const idPo = po => 'so-' + String(po).replace(/[^A-Za-z0-9]/g, '');

function lignePoRattacher(a) {
  let h = '<div class="row gris">';
  h += '<div class="l1"><span class="so">' + esc(a.po_name) + '</span>';
  if (a.fournisseur) h += '<span class="sep">·</span><span class="cli">' + esc(a.fournisseur) + '</span>';
  h += '<span class="badge b-gris">' + (a.ar_trouve ? 'AR reçu le ' + frDate(a.ar_le)
                                                    : 'commandé il y a ' + a.age_j + ' j') + '</span></div>';
  h += '<div class="l2"><span class="pastille p-gris">à rattacher</span>';
  h += '<span class="quoi">' + (a.date_lue ? 'livraison lue : ' + frDate(a.date_lue)
                                           : 'aucune date de livraison connue') + '</span>';
  h += '<span class="acts">';
  h += '<input type="text" id="' + idPo(a.po_name) + '" placeholder="SO…" autocomplete="off">';
  h += '<button class="btn-p" onclick="rattacherPo(\'' + esc(a.po_name) + '\',\'so\')">Rattacher</button>';
  h += '<button class="btn-s" onclick="rattacherPo(\'' + esc(a.po_name) + '\',\'conso\')">Consommable de prod</button>';
  h += '</span></div></div>';
  return h;
}

async function rattacherPo(po, geste) {
  const ch = document.getElementById(idPo(po));
  const so = ch ? ch.value.trim() : '';
  if (geste === 'so' && !so) { toast('Il manque le SO'); return; }
  try {
    const r = await fetch(PO_RATTACHER, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                          body: JSON.stringify({ po_name: po, geste: geste,
                                                                 so: so, qui: MOI }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    const d = await r.json();
    toast(d.ok ? po + ' — ' + d.message : d.message);
    // Le service refuse plutôt que d'inventer : on ne rafraîchit que s'il a écrit.
    if (d.ok) { chargerPoRattacher(); if (voitLesAchats()) chargerAR(); }
  } catch (e) { toast('Pas enregistré : ' + e.message); }
}

/* ---------- divers : ce qu on me demande, ce que je demande ---------- *
 * Deux objets dans une seule table, distingués par « pour qui » :
 *   pour_qui ≠ de_qui  →  une demande adressée à quelqu un
 *   pour_qui = de_qui  →  un pense-bête personnel, que personne d autre ne voit
 *
 * La FERMETURE PAR RÉPONSE ÉCRITE est le point central (Olivier, 30/10/2026) :
 * l objectif n est pas qu on coche « vu », c est qu on dise ce qu on a décidé et
 * pourquoi. C est ce qui distingue ce bloc d une liste qui se vide sans laisser
 * de trace. Une ligne réglée reste visible deux jours, puis sort du bloc ; le fil
 * lui-même reste en base.
 *
 * Garde-fou : ce bloc n accueille QUE ce qui n a pas d autre maison. Une question
 * client va dans FabStory, un achat dans Achats PP. Sinon il devient la poubelle
 * où l on range ce qu on ne veut pas traiter.
 * ------------------------------------------------------------------ */
const DV_LIRE     = 'https://protoprocess.app.n8n.cloud/webhook/pp-divers-liste';
const DV_CREER    = 'https://protoprocess.app.n8n.cloud/webhook/pp-divers-creer';
const DV_REPONDRE = 'https://protoprocess.app.n8n.cloud/webhook/pp-divers-repondre';

let DV_FORM = false;   // le formulaire reste ouvert d un rafraîchissement à l autre

async function chargerDivers() {
  const z = document.getElementById('bloc-divers');
  if (!z) return;
  try {
    const r = await fetch(DV_LIRE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                     body: JSON.stringify({ source: 'ma-gestion-de-projets',
                                                            version: APP_VERSION, qui: MOI }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    const d = await r.json();
    z.innerHTML = blocDivers(d);
    // Le compteur du bandeau dit exactement ce que dit le bloc : ce qui attend un geste
    // de MA part. Ce que j ai envoyé attend chez l autre, et ne se compte pas ici.
    const ch = document.getElementById('chip-divers');
    const n = ((d.on_me_demande || []).filter(x => !x.clos).length)
            + ((d.pense_bete    || []).filter(x => !x.clos).length);
    // v1.20 : le compteur vit maintenant dans « ce qui sonne », avec la structure
    // b + span, et se colore des qu il compte. Il faut donc poser la classe aussi.
    // v1.29 : cliquable comme les autres des qu il compte. Le pense-bete est en haut a
    // gauche, donc le « clic » ne fait pas vraiment defiler — mais il encadre les lignes,
    // et c est bien ce qu on cherche : savoir LESQUELLES.
    if (ch) {
      ch.className = 'l d' + (n > 0 ? ' on clic' : '');
      if (n > 0) ch.setAttribute('onclick', "allerVers('bloc-divers',':not(.vert)')");
      else ch.removeAttribute('onclick');
      ch.innerHTML = '<b>' + n + '</b><span>demande' + (n > 1 ? 's' : '') + '</span>';
    }
  } catch (e) {
    z.innerHTML = '<div class="msg err">Le bloc Divers n a pas pu être lu (' + esc(e.message)
                + '). Le reste de la page est à jour.</div>';
  }
}

function nomDe(ini) {
  if (!ini) return '—';
  const d = (DONNEES || []).find(x => x.initiales === ini);
  return d ? d.nom : ini;
}

function joursDe(x) {
  return (x.jours === null || x.jours === undefined) ? null : Number(x.jours);
}

// Le résumé de ligne reste sur une ligne : le texte entier est dans le détail.
function court(s, n) {
  const t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n - 1) + '…' : t;
}

// « Répondre » ouvre le détail sans se renommer : ce n est pas un bouton de pliage.
function ouvrirLigne(btn) { btn.closest('.row').classList.add('ouverte'); }

function etatDivers(x) {
  const j = joursDe(x);
  if (x.clos) return x.repondu_le ? 'répondu le ' + frDate(x.repondu_le) : 'réglé';
  if (j === null) return 'sans échéance';
  if (j < 0)  return 'échéance dépassée · J+' + (-j);
  if (j === 0) return "pour aujourd hui";
  return 'pour le ' + frDate(x.echeance);
}

function blocDivers(d) {
  const amoi = (d && d.on_me_demande) || [];
  const pb   = (d && d.pense_bete)    || [];
  const moi  = (d && d.je_demande)    || [];
  const amoiO = amoi.filter(x => !x.clos);
  const pbO   = pb.filter(x => !x.clos);
  // Ce que j ai envoyé et ce qui est déjà réglé ne doit pas occuper l écran : replié par défaut.
  const reste = amoi.filter(x => x.clos).concat(pb.filter(x => x.clos)).concat(moi);
  const depassee = x => { const j = joursDe(x); return j !== null && j < 0; };
  const n = amoiO.length + pbO.length;
  const cls = amoiO.some(depassee) ? 't-urg' : n ? 't-crit' : 't-ok';

  let h = entete(cls, '', 'MES DEMANDES, MON PENSE-BÊTE', n, '');
  if (!n && !reste.length)
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Rien en attente, ni pour toi ni de toi.</div>';
  h += amoiO.map(x => ligneDivers(x, false)).join('');
  h += pbO.map(x => ligneDivers(x, false)).join('');
  if (reste.length) {
    h += reste.map(x => ligneDivers(x, true)).join('');
    h += '<button class="plus" onclick="deplier(this)">Voir les ' + reste.length
       + ' autre' + (reste.length > 1 ? 's' : '') + ' — ce que j ai envoyé, et ce qui est réglé</button>';
  }
  h += formDivers();
  return h;
}

function ligneDivers(x, cache) {
  const pb = x.nature === 'pense_bete';
  const am = x.nature === 'on_me_demande';
  const j  = joursDe(x);
  const niv = x.clos ? 'vert' : (j !== null && j < 0) ? 'rouge' : am ? 'orange' : pb ? 'bleu' : 'gris';

  let h = '<div class="row ' + niv + (cache ? ' cache sup' : '') + '">';
  h += '<div class="l1"><span class="so">' + esc(x.objet) + '</span>';
  h += '<span class="sep">·</span><span class="cli">'
     + esc(pb ? 'pour moi' : am ? 'demandé par ' + nomDe(x.de_qui) : 'demandé à ' + nomDe(x.pour_qui))
     + '</span>';
  h += '<span class="badge b-' + niv + '">' + esc(etatDivers(x)) + '</span></div>';

  h += '<div class="l2">';
  h += '<span class="pastille p-' + niv + '">'
     + (x.clos ? 'réglé' : pb ? 'pense-bête' : am ? 'on me demande' : 'je demande') + '</span>';
  h += '<span class="quoi">' + esc(court(x.texte, 110)) + '</span>';
  h += '<span class="acts">';
  if (!x.clos && pb) h += '<button class="btn-s" onclick="gesteDivers(' + x.id + ',\'fait\')">C est fait</button>';
  if (!x.clos && am) h += '<button class="btn-p" onclick="ouvrirLigne(this)">Répondre</button>';
  if (!x.clos && !pb && !am) h += '<button class="btn-s" onclick="gesteDivers(' + x.id + ',\'relancer\')">Relancer</button>';
  h += '<button class="btn-s" onclick="plier(this)">Détail</button>';
  h += '</span></div>';

  h += '<div class="detail">';
  h += '<div class="fil"><div><span class="qui">' + esc(nomDe(x.de_qui)) + '</span>'
     + '<span class="quand">' + frDate(x.cree_le) + '</span></div>'
     + '<div>' + esc(x.texte || '(rien de plus que l objet)') + '</div></div>';
  if (x.reponse)
    h += '<div class="fil rep"><div><span class="qui">' + esc(nomDe(x.repondu_par || x.pour_qui)) + '</span>'
       + '<span class="quand">' + frDate(x.repondu_le) + '</span></div>'
       + '<div>' + esc(x.reponse) + '</div></div>';
  if (x.relance_le) h += '<div class="refs">relancé le ' + frDate(x.relance_le) + '</div>';

  if (!x.clos && am) {
    h += '<div class="geste">Une case cochée ne ferme rien ici : écris ce que tu as décidé, et pourquoi. '
       + 'C est ce texte qu on relira dans trois semaines.</div>';
    h += '<textarea id="dv-' + x.id + '" placeholder="Ta réponse…"></textarea>';
    h += '<div class="acts2">'
       + '<button class="btn-p" onclick="gesteDivers(' + x.id + ',\'repondre\')">Répondre et clore</button>'
       + '<button class="btn-s" onclick="gesteDivers(' + x.id + ',\'noter\')">Répondre sans clore</button></div>';
  }
  if (!x.clos && !pb && !am) {
    h += '<div class="acts2">'
       + '<button class="btn-s" onclick="gesteDivers(' + x.id + ',\'relancer\')">Relancer</button>'
       + '<button class="btn-s" onclick="decalerDivers(' + x.id + ')">Décaler l échéance</button>'
       + '<button class="btn-s" onclick="gesteDivers(' + x.id + ',\'annuler\')">Annuler la demande</button></div>';
  }
  if (!x.clos && pb) {
    h += '<div class="acts2">'
       + '<button class="btn-s" onclick="decalerDivers(' + x.id + ')">Décaler l échéance</button>'
       + '<button class="btn-s" onclick="gesteDivers(' + x.id + ',\'annuler\')">Retirer</button></div>';
  }
  h += '</div></div>';
  return h;
}

async function gesteDivers(id, geste) {
  const z = document.getElementById('dv-' + id);
  const rep = z ? z.value.trim() : '';
  if ((geste === 'repondre' || geste === 'noter') && !rep) { toast('Écris ta réponse d abord'); return; }
  try {
    const r = await fetch(DV_REPONDRE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ id: id, geste: geste, reponse: rep, qui: MOI }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    toast(geste === 'relancer' ? 'Relance notée'
        : geste === 'fait'     ? "C est fait"
        : geste === 'annuler'  ? 'Retirée'
        : geste === 'noter'    ? 'Réponse notée, la demande reste ouverte'
        : 'Réponse enregistrée');
    chargerDivers();
  } catch (e) { toast('Pas enregistré : ' + e.message); }
}

async function decalerDivers(id) {
  const v = prompt('Nouvelle échéance, au format JJ/MM/AAAA :', '');
  if (!v) return;
  const m = String(v).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) { toast('Format attendu : JJ/MM/AAAA'); return; }
  try {
    const r = await fetch(DV_REPONDRE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ id: id, geste: 'decaler',
                                                                echeance: m[3] + '-' + m[2] + '-' + m[1] }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    toast('Échéance décalée'); chargerDivers();
  } catch (e) { toast('Pas enregistré : ' + e.message); }
}

function formDivers() {
  if (!DV_FORM)
    return '<button class="plus" onclick="ouvrirFormDivers()">+ Une demande à quelqu un, ou un pense-bête</button>';
  const gens = (DONNEES || []).filter(g => g.initiales).sort((a, b) => a.nom.localeCompare(b.nom));
  let h = '<div class="dform"><div class="ligne">';
  h += '<label>pour</label><select id="dv-pour">';
  h += '<option value="' + esc(MOI) + '">moi (pense-bête)</option>';
  for (const g of gens) if (g.initiales !== MOI)
    h += '<option value="' + esc(g.initiales) + '">' + esc(g.nom) + '</option>';
  h += '</select>';
  h += '<label>objet</label><input type="text" id="dv-objet" placeholder="de quoi il s agit">';
  h += '<label>pour le</label><input type="date" id="dv-ech">';
  h += '</div>';
  h += '<textarea id="dv-texte" placeholder="Ce que tu demandes, et pourquoi. Sois précis : '
     + 'c est ce texte qui sera relu dans trois semaines."></textarea>';
  h += '<div class="ligne" style="margin:8px 0 0">';
  h += '<button class="btn-p" onclick="creerDivers()">Envoyer</button>';
  h += '<button class="btn-s" onclick="fermerFormDivers()">Annuler</button>';
  h += '<span class="aide">une demande, une personne — une responsabilité partagée n est portée par personne</span>';
  h += '</div></div>';
  return h;
}
function ouvrirFormDivers() { DV_FORM = true;  chargerDivers(); }
function fermerFormDivers() { DV_FORM = false; chargerDivers(); }

async function creerDivers() {
  const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const objet = val('dv-objet').trim();
  if (!objet) { toast("Il manque l objet"); return; }
  const pour = val('dv-pour') || MOI;
  try {
    const r = await fetch(DV_CREER, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ objet: objet, texte: val('dv-texte'),
                                                             de_qui: MOI, pour_qui: pour,
                                                             echeance: val('dv-ech') }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    DV_FORM = false;
    toast(pour === MOI ? 'Pense-bête noté' : 'Demande envoyée à ' + nomDe(pour));
    chargerDivers();
  } catch (e) { toast('Pas enregistré : ' + e.message); }
}

function chip(cl, n, lib) {
  return '<div class="chip ' + cl + '"><b>' + n + '</b> ' + lib + '</div>';
}

/* v1.20 : une ligne de « ce qui sonne ». A zero elle reste grise et muette ; des qu elle
   compte, elle se colore. Cinq compteurs empiles se lisent d un coup d oeil, cinq
   pastilles cote a cote non. */
function sonne(cl, n, lib, bloc, sel) {
  // v1.29 : le compteur devient un lien vers ses lignes des qu il compte quelque chose.
  const actif = n > 0 && bloc;
  return '<div class="l ' + cl + (n > 0 ? ' on' : '') + (actif ? ' clic' : '') + '"'
       + (actif ? ' onclick="allerVers(\'' + bloc + '\',\'' + (sel || '') + '\')"'
                + ' title="Voir ' + (n > 1 ? 'ces ' + n + ' lignes' : 'cette ligne') + '"' : '')
       + '><b>' + n + '</b><span>' + esc(lib) + '</span></div>';
}

/* v1.29 (03/11/2026, demande d Olivier) : LE CLIC D UN COMPTEUR DE « CE QUI SONNE ».
   Trois gestes dans l ordre, et pas un de plus :
     1. on deplie le bloc, MAIS seulement si une ligne visee est cachee ;
     2. on l amene au centre de l ecran ;
     3. on encadre les lignes du niveau demande pendant trois secondes.
   « sel » est ce qu on ajoute a « .row » pour designer les lignes a encadrer : « .rouge »
   pour un niveau, rien du tout quand le compteur vaut le bloc entier (les devis),
   « :not(.vert) » pour ecarter les lignes deja reglees (le pense-bete).
   Le halo precedent est toujours retire d abord : deux clics de suite sur deux compteurs
   differents ne doivent pas laisser deux zones allumees.

   v1.30 (03/11/2026 au soir, retour d Olivier : « j ai 6 lignes affichees au lieu de 3 ») :
   la v1.29 depliait TOUJOURS, et supprimait le bouton « Voir les N autres » — le bloc
   restait a six lignes pour le reste de la visite, sans moyen de revenir en arriere.
   Deux corrections : on ne deplie que si c est necessaire (les trois rouges sont le plus
   souvent deja en haut du bloc), et quand on deplie le bouton devient « Replier ». */
function allerVers(bloc, sel, deplier) {
  const el = document.getElementById(bloc);
  if (!el) return;
  document.querySelectorAll('.row.vise').forEach(r => r.classList.remove('vise'));
  el.classList.remove('replie');
  const cibles = el.querySelectorAll('.row' + (sel || ''));
  // offsetParent vaut null quand un parent est en display:none : c est le test le plus sur
  // pour savoir si la ligne est visible, qu elle soit cachee par .cache ou par .replie.
  const cachee = deplier !== false && [].some.call(cibles, r => r.offsetParent === null);
  if (cachee) {
    el.querySelectorAll('.sup').forEach(r => r.classList.remove('cache'));
    el.querySelectorAll('button.plus').forEach(b => {
      if (!b.dataset.libelle) b.dataset.libelle = b.textContent;
      b.textContent = 'Replier ▴';
      b.setAttribute('onclick', 'replier(this)');
    });
  }
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  cibles.forEach(r => r.classList.add('vise'));
  setTimeout(() => cibles.forEach(r => r.classList.remove('vise')), 3100);
}

/* v1.20 : trois lignes par bloc, le reste derriere « Voir les N autres ». Demande
   d Olivier du 02/11 : a trois blocs par ligne, un bloc qui deroule dix lignes decale
   tout ce qui est en dessous. Reutilise le mecanisme .sup/.cache deja en place. */
function capper(lignes, mot, n) {
  n = n || 3;
  if (lignes.length <= n) return lignes.join('');
  const reste = lignes.length - n;
  // « 1 autre commande » marche au masculin comme au feminin, contrairement a une elision
  // qu il faudrait accorder mot par mot. Un mot abrege (« P.O. ») ne prend pas de s.
  const pluriel = reste > 1 && !/\.$/.test(mot);
  return lignes.slice(0, n).join('')
       + '<div class="sup cache">' + lignes.slice(n).join('') + '</div>'
       + '<button class="plus" onclick="deplier(this)">Voir '
       + (reste > 1 ? 'les ' + reste + ' autres ' : '1 autre ')
       + esc(mot) + (pluriel ? 's' : '') + ' ▾</button>';
}

function entete(cls, ico, titre, n, rep) {
  // L en-tete entier est cliquable : il replie le bloc. Un bloc traite ne doit pas
  // occuper l ecran de ceux qui restent.
  let h = '<div class="shead ' + cls + '" onclick="plierBloc(this)" title="Replier ce bloc">';
  h += '<h2>' + titre + '</h2>';
  if (rep) h += rep;
  h += '<span class="cpt ' + (cls === 't-urg' ? 'c-urg' : cls === 't-crit' ? 'c-crit' : 'c-ok') + '">' + n + '</span></div>';
  return h;
}

function repartition(aff) {
  const t = aff.length; if (!t) return '';
  const r = aff.filter(a => a.niveau === 'rouge').length;
  const o = aff.filter(a => a.niveau === 'orange').length;
  const b = t - r - o;
  return '<span class="repart">'
    + '<span class="sp-r" style="width:' + (r/t*100) + '%"></span>'
    + '<span class="sp-a" style="width:' + (o/t*100) + '%"></span>'
    + '<span class="sp-b" style="width:' + (b/t*100) + '%"></span></span>';
}

function blocAffaires(d) {
  const aff = (d && d.affaires_a_geste) || [];
  const calmes = (d && d.affaires_calmes) || [];
  const pire = aff.some(a => a.niveau === 'rouge') ? 't-urg'
             : aff.length ? 't-crit' : 't-ok';
  let h = '<section id="bloc-appro">';
  h += entete(pire, 'ti-alert-triangle', 'CE QUI ATTEND TON GESTE', aff.length, repartition(aff));
  // Ce bloc vient du balayage de 5h50, qui ne tourne que les jours ouvrables. Week-end, férié,
  // lundi avant 5h50, ou matin où le balayage casse : on montre le dernier état connu, et on dit
  // de quand il date. Un zéro qu'on ne distingue pas d'une bonne nouvelle est pire que rien.
  const vieux = d && d.balayage_a_jour === false && d.balaye_le;
  if (vieux)
    h += '<div class="dater">État du <strong>' + esc(jourEtDate(d.balaye_le))
       + '</strong> — le balayage tourne à 5h50 les jours ouvrables. Rien n\'a été relevé depuis.</div>';
  if (!aff.length) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> '
       + (vieux ? 'Rien à faire ici au dernier balayage.' : 'Rien à faire ici. Tout est à jour.')
       + '</div>';
  } else {
    h += capper(aff.map(a => ligneAffaire(a, false)), 'affaire');
  }
  if (calmes.length) {
    h += calmes.map(a => ligneAffaire(a, true)).join('');
    h += '<button class="plus" onclick="deplier(this)">Voir les ' + calmes.length
       + ' affaire' + (calmes.length > 1 ? 's' : '') + ' à garder à l œil ▾</button>';
  }
  h += '</section>';
  return h;
}

function ligneAffaire(a, calme) {
  const niv = calme ? 'gris' : a.niveau;
  const b0 = (a.blocs && a.blocs[0]) || {};
  // Le service fournit « resume » deja formule : avec un nombre pour ce qui se compte en
  // references, sans nombre pour les faits uniques. La page ne recompose rien — sinon on
  // relit « 1 rien de lance ».
  const resume = a.blocs.map(b => b.resume || b.libelle).join(' · ');
  // v1.35 : la ligne porte un identifiant, pour pouvoir la faire sortir de l écran quand on
  // vient de la mettre en sourdine, sans attendre le rechargement complet.
  let h = '<div class="row ' + niv + (calme ? ' cache sup' : '') + '" id="aff-' + esc(a.so) + '">';
  h += '<div class="l1"><span class="so">' + esc(a.so) + '</span>';
  if (a.client) h += '<span class="sep">·</span><span class="cli">' + esc(a.client) + '</span>';
  h += '<span class="badge b-' + niv + '">' + esc(a.badge) + '</span></div>';

  h += '<div class="l2"><span class="pastille p-' + niv + '">' + esc(b0.titre || b0.libelle || '') + '</span>';
  // Retour en stock constate par le check Luminovo (8h et 14h) ou le balayage large.
  // Ne se voit sans deplier que si la piece est reellement ACHETABLE : un stock partiel
  // ne debloque pas l affaire et n a donc rien a faire sur la premiere ligne.
  const retAch = (a.retours || []).filter(r => r.achetable);
  if (retAch.length) {
    h += '<span class="pastille p-vert">' + retAch.length + ' revenue'
       + (retAch.length > 1 ? 's' : '') + ' en stock</span>';
  }
  h += '<span class="quoi">' + esc(resume) + '</span>';
  h += '<span class="acts">';
  // v1.14 : on part sur l affaire QU ON VIENT DE CLIQUER, dans un onglet a part.
  // Avant, Achats PP s ouvrait dans cette page (tableau de bord perdu) et demandait
  // de retaper un SO qui etait deja sous les yeux.
  h += '<a class="btn-p" target="_blank" rel="noopener" href="' + RACINE
     + 'achats/bom-sourcing/?onglet=achats&so=' + encodeURIComponent(a.so) + '">Je m en occupe</a>';
  // v1.35 : LA MISE EN SOURDINE EST SUR LA LIGNE, juste apres le geste principal.
  // Elle etait derriere « Détail », la ou vivait l ancien lien a jeton : un clic de trop pour
  // un geste qu on veut voir utilise, et qui restait invisible tant qu on n avait pas deplie.
  // Sa place est ici, parce que c est l alternative au geste principal — soit je m en occupe,
  // soit j explique pourquoi on attend.
  h += '<button class="btn-s" onclick=\'ouvrirSourdine('
     + JSON.stringify({ so: a.so, client: a.client || '', carte: a.carte || '',
                        libelle: resume, responsable: MOI }).replace(/'/g, '&#39;')
     + ')\'>Mettre en sourdine</button>';
  // Le contexte part avec le clic : SO, client, etat et motifs, tels qu ils sont a l ecran.
  const ctx = 'Affaire ' + a.so + (a.client ? ' — ' + a.client : '')
            + (a.carte ? ' (' + a.carte + ')' : '')
            + ' · ' + a.badge + ' · ' + resume
            + (a.arc ? ' · livraison promise le ' + frDate(a.arc) : '');
  h += '<button class="btn-s" onclick="aideLigne(event,' + JSON.stringify(ctx).replace(/"/g, '&quot;') + ')">Aide</button>';
  h += '<button class="btn-s" onclick="plier(this)">Détail</button>';
  h += '</span></div>';

  h += '<div class="detail">';
  if (a.carte) h += esc(a.carte);
  if (a.arc) h += ' · livraison promise le ' + frDate(a.arc);
  for (const b of (a.blocs || [])) {
    h += '<div style="margin-top:8px">';
    h += '<span class="pastille p-' + (b.niveau || niv) + '">' + esc(b.titre || b.libelle) + '</span>';
    const refs = (b.refs_rouges && b.refs_rouges.length ? b.refs_rouges : b.refs) || [];
    if (refs.length) {
      h += refs.slice(0,3).map(r => '<div class="refs">' + esc(r) + '</div>').join('');
      if (refs.length > 3) h += '<div class="refs">+ ' + (refs.length - 3) + ' autres</div>';
    }
    if (b.fournisseur) h += '<div class="refs">chez ' + esc(b.fournisseur) + '</div>';
    if (b.jours_au_panier != null) h += '<div class="refs">au panier depuis ' + b.jours_au_panier + ' jours</div>';
    if (b.question_depuis) h += '<div class="refs">question au client ouverte depuis le ' + frDate(b.question_depuis) + '</div>';
    if (b.motif) h += '<div class="refs">' + esc(b.motif) + '</div>';
    if (b.geste) h += '<div class="geste">' + esc(b.geste) + '</div>';
    h += '</div>';
  }
  // Le detail dit CHEZ QUI la piece est revenue — ce que le mail Luminovo ne disait jamais.
  if (a.retours && a.retours.length) {
    h += '<div style="margin-top:8px">';
    h += '<span class="pastille p-vert">retour en stock</span>';
    for (const r of a.retours) {
      const ou = esc(r.fournisseur || '?');
      h += '<div class="refs">' + esc(r.mpn) + ' — ' + (r.achetable
        ? 'commandable chez ' + ou + (r.ref_fournisseur ? ' (réf ' + esc(r.ref_fournisseur) + ')' : '')
        : 'seulement ' + r.stock + ' chez ' + ou + ' pour ' + r.besoin + ' nécessaires')
        + (r.vu_le ? ' · vu le ' + frDate(r.vu_le) : '') + '</div>';
    }
    if (retAch.length) {
      h += '<div class="geste">Les références commandables ont déjà été remises à jour dans la feuille '
         + 'Paniers en attente : le fournisseur et la référence y sont inscrits, la ligne est repartie '
         + 'dans le panier.</div>';
    } else {
      h += '<div class="geste">Le stock trouvé ne couvre pas le besoin : rien n a été inscrit dans la '
         + 'feuille. À toi de voir s il faut prendre ce qu il y a, chercher un équivalent, ou attendre.</div>';
    }
    h += '</div>';
  }
  h += '<div class="acts2">';
  // Les trois endroits ou une affaire se traite reellement. FabStory ouvre LA carte
  // (?produit=), pas la liste. Luminovo n existe que sur un tiers des affaires.
  if (a.lien_fabstory) h += '<a class="lien" target="_blank" href="' + esc(a.lien_fabstory) + '">FabStory</a>';
  if (a.lien_odoo) h += '<a class="lien" target="_blank" href="' + esc(a.lien_odoo) + '">Odoo</a>';
  if (a.lien_luminovo) h += '<a class="lien" target="_blank" href="' + esc(a.lien_luminovo) + '">Luminovo</a>';
  h += '</div></div></div>';
  return h;
}

function blocDevis(d) {
  const devis = (d && d.devis) || [];
  const cls = devis.length ? 't-crit' : 't-ok';
  // v1.29 : le bloc porte un identifiant pour que le compteur « devis a traiter » de
  // « ce qui sonne » puisse y emmener.
  let h = '<section id="bloc-devis">';
  h += entete(cls, 'ti-file-text', 'MES DEVIS À TRAITER', devis.length, '');
  if (!devis.length) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Rien à faire ici. Tout est à jour.</div>';
  } else {
    for (const v of devis) {
      const relance = v.type === 'devis_relance';
      h += '<div class="row ' + (relance ? 'orange' : 'bleu') + '">';
      h += '<div class="l1"><span class="cli">' + esc(v.client) + '</span>';
      h += '<span class="badge b-' + (relance ? 'orange' : 'bleu') + '">' + v.jours + ' j</span></div>';
      h += '<div class="l2"><span class="pastille p-' + (relance ? 'orange' : 'bleu') + '">'
         + (relance ? 'sans réponse du client' : 'pas encore lu') + '</span>';
      h += '<span class="quoi">' + esc(v.objet) + '</span>';
      h += '<span class="acts">';
      h += '<a class="btn-p" href="' + GMAIL + esc(v.thread_id) + '">Ouvrir le mail</a>';
      h += '<button class="btn-s" onclick="plier(this)">Détail</button>';
      h += '</span></div>';
      h += '<div class="detail">reçu le ' + frDate(v.recu_le);
      h += '<div class="geste">' + esc(v.geste) + '</div></div></div>';
    }
  }
  h += '</section>';
  return h;
}

function outils() {
  const pole = POLES[POLE_DE[MOI] || 'commercial_achats'];
  let h = '<div class="outils"><h3>MES OUTILS — ' + esc(pole.nom.toUpperCase()) + '</h3><div class="tuiles">';
  for (const k of outilsDe(MOI)) {
    const o = OUTILS[k]; if (!o) continue;
    h += '<a class="tuile" href="' + RACINE + o.u + '" data-appli="' + esc(k) + '">';
    h += '<i class="ti ' + o.i + '"></i><div><div class="tt">' + esc(o.t) + '</div>';
    h += '<div class="ts">' + esc(o.s) + '</div></div></a>';
  }
  // v1.30 : la derniere tuile, pour tout le monde. Elle part vers Claude et pas vers une
  // appli : fond ambre pour qu on ne la confonde pas avec un outil de production.
  h += '<a class="tuile aide" href="' + lienAide() + '" target="_blank" rel="noopener"'
     + ' data-appli="aide-claude">';
  h += '<i class="ti ti-message-circle-question"></i><div><div class="tt">Demander de l’aide</div>';
  h += '<div class="ts">Claude, projet Proto Process</div></div></a>';
  h += '</div>';
  // v1.24 (03/11/2026, demande d Olivier) : la ligne « autres outils » est réservée à la
  // DIRECTION. Elle était héritée du hub, qui montrait tout à tout le monde : Triage, Annexe
  // devis, Tutos et surtout la PAIE se retrouvaient à portée de clic pour toute l équipe.
  if (POLE_DE[MOI] === 'direction') {
    h += '<p class="autres">Autres outils :';
    AUTRES.forEach(a => {
      h += ' <a href="' + RACINE + a.u + '" data-appli="' + esc(a.t.toLowerCase()) + '">' + esc(a.t) + '</a>';
    });
    h += '</p>';
  }
  h += '</div>';
  return h;
}

/* ---------- interactions ---------- */
function plierBloc(head) {
  head.closest('section').classList.toggle('replie');
}
function plier(btn) {
  const r = btn.closest('.row');
  const ouvert = r.classList.toggle('ouverte');
  btn.textContent = ouvert ? 'Replier' : 'Détail';
}
function deplier(btn) {
  btn.closest('section').querySelectorAll('.sup').forEach(r => r.classList.remove('cache'));
  btn.remove();
}
/* v1.30 : le retour en arriere apres un depliage declenche par un compteur de « ce qui
   sonne ». Le bouton reprend son libelle d origine, garde en dataset au moment du clic. */
function replier(btn) {
  btn.closest('section').querySelectorAll('.sup').forEach(r => r.classList.add('cache'));
  btn.textContent = btn.dataset.libelle || 'Voir les autres ▾';
  btn.setAttribute('onclick', 'deplier(this)');
}
function toast(txt) {
  const t = document.getElementById('toast');
  t.textContent = txt; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1400);
}

charger();
