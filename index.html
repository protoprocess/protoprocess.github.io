<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon tableau de bord</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="achats/shared/pp-acces.js"></script>
<!-- 03/11/2026 : un seul chemin vers Claude pour toutes les applis PP. Ce fichier porte
     l adresse du projet et la regle d identite ; cette page s y aligne comme Achats PP
     et le deroule devis. -->
<script src="achats/shared/pp-aide-claude.js"></script>
<script src="achats/shared/pp-signalement.js" defer></script>
<!-- retour-accueil.js n est PAS charge ici : cette page EST l accueil. -->
<link rel="icon" href="achats/shared/picto-pp.png">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#fafbfc;
  --border:#e4e7ec; --border2:#cfd5de;
  --text:#1b2232; --text2:#5a6577; --text3:#8e98a8;
  --orange:#F07B1F; --orange-bg:#FDF1E6;
  --ppblue:#17697A; --ppblue-bg:#E6F2F4;
  --rouge:#A32D2D; --rouge-bg:#FCEBEB; --rouge-l:#C94B4B;
  --ambre:#854F0B; --ambre-bg:#FAEEDA; --ambre-l:#D89B3A;
  --bleuf:#2F5273; --bleuf-bg:#EAF0F6; --bleuf-l:#5A7FA3;
  --vert:#3B6D11;  --vert-bg:#EAF3DE;
  --radius:6px; --radius-lg:10px;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px}

header{background:var(--surface);height:52px;display:flex;align-items:center;gap:14px;
  padding:0 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.logo-text{display:flex;align-items:center;font-size:13px;font-weight:600}
.logo-text .lt{color:var(--text)}.logo-text .ls{color:var(--border2);margin:0 4px}
.logo-text .lo{color:var(--orange)}
.vbadge{font-size:10px;color:var(--text3);border:1px solid var(--border);
  border-radius:20px;padding:2px 9px;font-family:var(--mono)}
.spacer{flex:1}
.moi{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 6px 4px 12px;font-size:12px}
.moi .nom{color:var(--text);font-weight:600}
.moi button{background:transparent;border:none;color:var(--text3);font-size:11px;cursor:pointer;
  padding:3px 8px;border-radius:14px}
.moi button:hover{background:#eef1f5;color:var(--text2)}
.score{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.score b{color:var(--vert);font-size:15px;font-family:var(--mono)}

.wrap{max-width:min(96vw,1800px);margin:0 auto;padding:20px 20px 70px}
/* v1.24 : la page empile deux conteneurs. Celui du bandeau URGENT héritait du padding bas
   de 70 px prévu pour la fin de page : 90 px de vide entre le bandeau et les outils. */
.wrap-urgent{padding-bottom:0}
.wrap-urgent.vide{padding:0}
#app{padding-top:14px}

/* choix de la personne */
.portail{max-width:460px;margin:60px auto;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:26px;box-shadow:0 1px 3px rgba(20,30,50,.06)}
.portail h1{margin:0 0 6px;font-size:17px}
.portail p{margin:0 0 18px;color:var(--text2);font-size:12.5px;line-height:1.6}
.qui{display:flex;flex-direction:column;gap:8px}
.qui button{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);font-size:13px;cursor:pointer;
  text-align:left;color:var(--text);font-family:var(--sans)}
.qui button:hover{border-color:var(--orange);background:var(--orange-bg)}
.qui .ini{font-family:var(--mono);font-size:11px;color:var(--text3);
  background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px}

/* v1.20 : la tete de page. Les indicateurs a gauche, « ce qui sonne » a droite.
   Avant, les pastilles tenaient une ligne entiere et les courbes une autre : deux bandes
   pour cinq chiffres et trois petites mesures. */
/* v1.25 (03/11/2026, demande d Olivier) : les graphiques prenaient toute la largeur
   disponible et collaient aux tuiles d outils. Ils sont ramenes a une part raisonnable,
   « ce qui sonne » et le pense-bete occupent le reste, et la bande respire sous les outils. */
.tete{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0 16px;align-items:stretch}
/* v1.31 : les graphiques prennent plus de large, parce que l equaliseur de charge y occupe
   deux colonnes. Sans ca la bande passait sur deux rangees et cassait la ligne d horizon. */
/* v1.32 : « ce qui sonne » a disparu de la bande. Sa place se partage entre le pense-bete,
   qui respire enfin, et les graphiques, ou l equaliseur occupe deux colonnes. */
.tete .courbes{flex:5 1 600px;min-width:0;margin-bottom:0}
.tete .pense{flex:2 1 320px;min-width:280px;max-width:440px;display:flex;flex-direction:column}
.tete .pense .shead{padding:9px 12px}
.tete .pense .shead h2{font-size:11.5px}
.tete .pense .vide,.tete .pense .msg{font-size:12px;padding:10px 12px}
.tete .pense .row{padding:8px 12px}
.sonne{flex:1 1 270px;min-width:240px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:11px 13px}
.sonne h3{margin:0 0 9px;font-size:9.5px;letter-spacing:.06em;color:var(--text3);font-weight:700}
/* v1.24 (03/11/2026, demande d Olivier) : la bande du haut prenait trop de hauteur.
   Les cinq compteurs passent sur deux colonnes : la carte descend de ~160 à ~100 px, et
   comme la bande est en align-items:stretch, les courbes se resserrent d autant. */
.sonne .liste{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px}
.sonne .l{display:flex;align-items:center;gap:8px;padding:1px 0}
.sonne .l b{width:20px;height:20px;border-radius:5px;background:#f1f3f6;color:var(--text3);
  font-family:var(--mono);font-size:11.5px;display:flex;align-items:center;justify-content:center}
.sonne .l span{font-size:12px;color:var(--text3)}
/* Un compteur a zero reste gris : il ne demande rien. Des qu il compte, il se colore et
   son libelle passe en noir — c est le seul signal qui doit attraper l oeil. */
.sonne .l.on b{background:var(--surface2)} .sonne .l.on span{color:var(--text);font-weight:600}
.sonne .l.on.r b{background:var(--rouge-bg);color:var(--rouge)}
.sonne .l.on.a b{background:var(--ambre-bg);color:var(--ambre)}
.sonne .l.on.b b{background:var(--bleuf-bg);color:var(--bleuf)}
.sonne .l.on.d b{background:var(--ppblue-bg);color:var(--ppblue)}
/* v1.29 (03/11/2026, demande d Olivier) : UN COMPTEUR QUI COMPTE EST CLIQUABLE.
   Avant : « 3 en danger » etait un chiffre mort — on savait qu il y avait trois affaires
   rouges, pas lesquelles, et il fallait aller les chercher a l oeil dans un bloc replie a
   trois lignes. « De l info mais on sait pas quoi exactement ». Le clic emmene au bloc,
   le deplie en entier et encadre les lignes concernees.
   Un compteur a zero n est PAS cliquable : la main du curseur dit d un coup d oeil ce qui
   mene quelque part et ce qui ne mene nulle part. */
.sonne .l.clic{cursor:pointer;border-radius:5px;margin:0 -4px;padding:1px 4px;
  transition:background .12s}
.sonne .l.clic:hover{background:var(--surface2)}
.sonne .l.clic:hover span{text-decoration:underline;text-underline-offset:2px}
/* La ligne visee : un halo qui s eteint tout seul. Pas de deplacement, pas de changement de
   taille — la ligne ne doit pas bouger sous l oeil qui vient de la trouver. */
/* Le halo est gris ardoise, et pas l une des couleurs de niveau : une ligne rouge encadree
   d ambre se lit mal, et un encadre qui reprend la couleur du niveau n ajoute aucune
   information. Le gris dit « c est celle-la » sur les trois fonds. */
@keyframes vise{0%{box-shadow:0 0 0 3px rgba(22,32,52,.55)}70%{box-shadow:0 0 0 3px rgba(22,32,52,.55)}
  100%{box-shadow:0 0 0 3px rgba(22,32,52,0)}}
.row.vise{animation:vise 3s ease-out 1;border-radius:var(--radius);position:relative;z-index:1}
.resume{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:9px 14px;font-size:12px;color:var(--text2)}
.chip b{font-family:var(--mono);font-size:15px;color:var(--text)}
.chip.r b{color:var(--rouge)} .chip.a b{color:var(--ambre)} .chip.b b{color:var(--bleuf)}

/* v1.20 : trois blocs par ligne (demande Olivier du 02/11). En dessous de 1180 px on
   repasse a deux, puis a un : a un tiers de 900 px une ligne de P.O. ne tient plus. */
.grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1180px){ .grille{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){ .grille{grid-template-columns:1fr} }
@media (max-width:1100px){.grille{grid-template-columns:1fr}}
/* v1.15 : TOUS les blocs sont en demi-page (demande Olivier du 02/11/2026 : un bloc
   pleine largeur oblige l oeil a traverser l ecran pour rien). En demi-largeur une
   ligne chargee — bloc AR : une date et trois boutons — n entre plus sur un seul
   rang : les gestes passent alors sous le libelle au lieu de deborder. */
.grille > section{min-width:0}

/* v1.16 : la bande de courbes. Fine par construction — c'est un résultat qu'on regarde
   une seconde, pas un tableau qu'on lit. Elle ne doit jamais repousser les blocs. */
/* v1.20 : l anneau des livraisons. Le chiffre est au centre, la legende a cote — pas
   dessous : a trois cartes par bande, la hauteur est comptee. */
.anneau{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.anneau svg{flex-shrink:0}
.anneau .leg{display:flex;flex-direction:column;gap:3px;min-width:0}
.anneau .leg div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);white-space:nowrap}
.anneau .leg i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.courbes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.courbe{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:10px 13px 8px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden}
.courbe .ct{font-size:10px;letter-spacing:.06em;color:var(--text3);font-weight:700}
.courbe .cv{font-size:18px;font-weight:700;color:var(--text);margin-top:1px;line-height:1.1}
.courbe .cv span{font-size:12px;font-weight:600;color:var(--text3)}
.courbe .cs{font-size:10.5px;color:var(--text3);margin-top:1px}
.courbe .spark{display:block;width:100%;height:26px;margin:3px 0 0}
.l2{flex-wrap:wrap}
.l2 .quoi{min-width:110px}

section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.shead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);
  background:var(--surface2)}
.shead h2{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.3px;flex:1}
.shead i.ico{font-size:17px}
.t-ok h2,.t-ok i.ico{color:var(--ppblue)}
.t-crit h2,.t-crit i.ico{color:var(--orange)}
.t-urg h2,.t-urg i.ico{color:var(--rouge)}
.cpt{font-family:var(--mono);font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px}
.c-ok{background:var(--ppblue-bg);color:var(--ppblue)}
.c-crit{background:var(--ambre-bg);color:var(--ambre)}
.c-urg{background:var(--rouge-bg);color:var(--rouge)}
.repart{display:flex;height:7px;width:86px;border-radius:4px;overflow:hidden;background:#eef1f5}
.repart span{display:block;height:100%}
.sp-r{background:var(--rouge-l)} .sp-a{background:var(--ambre-l)} .sp-b{background:var(--bleuf-l)}
.vide{padding:16px 14px;color:var(--vert);font-size:12px;display:flex;align-items:center;gap:8px}

.row{position:relative;padding:10px 12px 10px 16px;border-bottom:1px solid #f0f2f5;
  transition:opacity .4s ease,transform .4s ease,max-height .4s ease;max-height:460px;overflow:hidden}
.row:last-of-type{border-bottom:none}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.row.rouge::before{background:var(--rouge-l)}  .row.rouge{background:#fffafa}
.row.orange::before{background:var(--ambre-l)} .row.orange{background:#fffdf8}
.row.bleu::before{background:var(--bleuf-l)}
.row.gris::before{background:var(--border2)}
.row.parti{opacity:0;transform:translateX(26px);max-height:0;padding-top:0;padding-bottom:0;border:none}
.l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.l1 .so{font-family:var(--mono);font-size:12px;font-weight:700}
.l1 .cli{color:var(--text2);font-size:12px}
.l1 .sep{color:var(--border2)}
.l1 .badge{margin-left:auto}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;
  color:#fff;white-space:nowrap}
.b-rouge{background:var(--rouge)} .b-orange{background:var(--ambre)}
.b-bleu{background:var(--bleuf)} .b-gris{background:#6b7280}
.l2{display:flex;align-items:center;gap:8px;margin-top:6px}
.l2 .quoi{font-size:12px;color:var(--text2);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;flex-shrink:0}
.p-rouge{background:var(--rouge-bg);color:var(--rouge)}
.p-orange{background:var(--ambre-bg);color:var(--ambre)}
.p-bleu{background:var(--bleuf-bg);color:var(--bleuf)}
.p-gris{background:#eef1f5;color:var(--text2)}
.p-vert{background:var(--vert-bg);color:var(--vert)}
.acts{display:flex;align-items:center;gap:5px;flex-shrink:0}
/* Champ de date du bloc AR fournisseur : meme gabarit que les boutons, pour que la ligne
   garde sa hauteur quand la date est proposee ou saisie a la main. */
.acts input[type=text]{padding:4px 7px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:12px;font-family:var(--mono);color:var(--text);background:#fff;width:118px}
.acts input[type=text]:focus{outline:none;border-color:var(--orange)}
.acts input[type=date]{padding:4px 7px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:11.5px;font-family:var(--sans);color:var(--text);background:#fff}
.acts input[type=date]:focus{outline:none;border-color:var(--orange)}
.btn-p{padding:5px 11px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);
  font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;
  display:inline-block;font-family:var(--sans)}
.btn-p:hover{background:#d96c15}
.btn-s{padding:5px 11px;background:var(--surface);color:var(--text2);border:1px solid var(--border);
  border-radius:var(--radius);font-size:11.5px;cursor:pointer;white-space:nowrap;text-decoration:none;
  display:inline-block;font-family:var(--sans)}
.btn-s:hover{border-color:var(--border2);color:var(--text)}
.detail{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);
  font-size:11.5px;color:var(--text2);line-height:1.6}
.row.ouverte .detail{display:block}
.detail .geste{color:var(--text);margin-top:4px}
.detail .refs{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:3px}
.detail .acts2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.lien{font-size:11px;color:var(--text3);text-decoration:none;border-bottom:1px dotted var(--border2);
  padding-bottom:1px;margin-left:4px}
.lien:hover{color:var(--ppblue);border-bottom-color:var(--ppblue)}
.shead{cursor:pointer}
.shead h2::after{content:" ▾";color:var(--text3);font-size:10px}
section.replie .shead h2::after{content:" ▸"}
/* v1.24 (03/11/2026, demande d Olivier) : replier un bloc l ALLÈGE, il ne l efface pas.
   Les trois premières lignes restent lisibles ; seules la quatrième et les suivantes
   disparaissent. Un bloc replié à zéro ligne obligeait à le rouvrir pour savoir ce qu il
   contenait — le replier ne servait donc à rien. */
section.replie > .row ~ .row ~ .row ~ .row{display:none}
section.replie .vide,section.replie .plus,section.replie .msg{display:none}
.plus{display:block;width:100%;text-align:center;padding:8px;background:var(--surface2);
  border:none;border-top:1px solid var(--border);color:var(--text2);font-size:11px;
  cursor:pointer;font-weight:600;font-family:var(--sans)}
.plus:hover{color:var(--orange)}
.cache{display:none}

/* de quand datent les données d'un bloc, quand ce n'est pas d'aujourd'hui */
.dater{padding:7px 14px;background:var(--ambre-bg);color:var(--ambre);font-size:11.5px;
  line-height:1.5;border-bottom:1px solid var(--border)}
section.replie .dater{display:none}

/* bloc Divers : le fil de la demande, la réponse écrite, le formulaire */
.chip.d b{color:var(--ppblue)}
.row.vert::before{background:#7aa84f} .row.vert{background:#fcfdfa}
.b-vert{background:var(--vert)}
.fil{margin-top:8px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);font-size:11.5px;line-height:1.6;color:var(--text2)}
.fil.rep{border-left:3px solid var(--vert)}
.fil .qui{font-weight:700;color:var(--text)}
.fil .quand{color:var(--text3);font-size:10.5px;font-family:var(--mono);margin-left:6px}
.detail textarea{width:100%;min-height:54px;resize:vertical;margin-top:8px;padding:7px 9px;
  border:1px solid var(--border);border-radius:var(--radius);font-size:12px;
  font-family:var(--sans);color:var(--text);background:#fff}
.dform{padding:12px 14px;background:var(--surface2);border-top:1px solid var(--border)}
.dform .ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.dform label{font-size:11px;color:var(--text3);font-weight:600}
.dform input[type=text],.dform select,.dform input[type=date],.dform textarea{
  padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:12px;font-family:var(--sans);color:var(--text);background:#fff}
.dform input[type=text]{flex:1;min-width:200px}
.dform textarea{width:100%;min-height:54px;resize:vertical}
.dform input:focus,.dform select:focus,.dform textarea:focus,.detail textarea:focus{
  outline:none;border-color:var(--orange)}
.dform .aide{font-size:11px;color:var(--text3)}

/* tuiles applis */
.outils{margin-top:26px}
.outils h3{font-size:11px;letter-spacing:.06em;color:var(--text3);font-weight:700;margin:0 0 10px}
/* v1.19 : ligne « autres outils », reprise de l ancien hub. Volontairement discrete :
   ce sont des outils qu on ouvre rarement, ils ne doivent pas concurrencer les tuiles. */
.autres{margin:14px 0 0;font-size:12px;color:var(--text3)}
.autres a{color:var(--text2);text-decoration:none;border-bottom:1px solid var(--border2);margin-left:9px}
.autres a:hover{color:var(--ppblue);border-bottom-color:var(--ppblue)}
/* v1.19 : bandeau URGENT, repris de l ancien hub — SO en stock critique. */
.urgent{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--rouge-bg);
  border:1px solid var(--rouge-l);border-radius:8px;padding:10px 13px;margin:0 0 16px;
  font-size:12.5px;color:var(--rouge);font-weight:600}
.urgent .so{display:flex;gap:7px;flex-wrap:wrap}
.urgent .so a{display:inline-flex;align-items:center;gap:5px;background:var(--surface);
  border:1px solid var(--rouge-l);border-radius:5px;padding:2px 8px;color:var(--rouge);
  text-decoration:none;font-weight:600}
.urgent .so a small{font-weight:400;color:var(--text2)}
/* v1.30 : l attribut hidden ne suffit pas. La regle du navigateur [hidden]{display:none}
   perd contre le display:flex ci-dessus, qui est plus specifique : le bandeau se vidait
   mais son cadre rouge restait a l ecran, en haut a gauche, sans rien dedans. */
.urgent[hidden]{display:none}
/* v1.30 : la tuile d aide ne mene pas a une appli mais a Claude. Fond ambre pour la
   distinguer des portes de production sans la rendre bruyante. */
.tuile.aide{background:var(--ambre-bg)}

/* v1.31 : L EQUALISEUR DE CHARGE. Il remplace la courbe « ma pile » dans la bande.
   Il prend DEUX colonnes de la bande : a 198 px il n y avait pas la place pour cinq
   libelles lisibles, et c est la carte qu on regarde en premier.
   Hauteur bloquee a 122 px, celle des cartes voisines (demande d Olivier : « garder une
   symetrie et de la coherence dans la page »). Tout le reste en decoule : .pile fait
   54 px, soit huit pastilles de 5 px et leurs sept interstices de 2 px. */
.courbe.eq{grid-column:span 2}
.eqcols{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.eqcols .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;border-radius:var(--radius);padding:2px 0;transition:background .12s}
.eqcols .col:hover{background:var(--surface2)}
.eqcols .n{font-family:var(--mono);font-size:11.5px;font-weight:700;line-height:1;margin-bottom:3px}
/* column-reverse : la premiere pastille ecrite — la plus urgente — se pose EN BAS. */
.eqcols .pile{display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start;
  width:100%;max-width:34px;height:54px;overflow:hidden}
.eqcols .pile i{display:block;height:5px;border-radius:2px;background:var(--border2);flex-shrink:0}
.eqcols .pile i.r{background:var(--rouge-l)} .eqcols .pile i.a{background:var(--ambre-l)}
.eqcols .pile i.b{background:var(--bleuf-l)} .eqcols .pile i.g{background:var(--border2)}
/* La pastille du haut s estompe quand la colonne est coupee : le total au-dessus dit le vrai
   nombre, cette pastille dit seulement « ca continue ». */
.eqcols .pile i.tronq{opacity:.4}
.eqcols .lib{font-size:8.5px;color:var(--text3);margin-top:5px;width:100%;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqcols .col.r .n{color:var(--rouge)} .eqcols .col.a .n{color:var(--ambre)}
.eqcols .col.v .n{color:var(--vert)}  .eqcols .col.z .n{color:var(--text3)}
/* Sous 820 px la bande passe a une carte par ligne : l equaliseur reprend toute la largeur. */
@media (max-width:820px){ .courbe.eq{grid-column:span 1} }
/* v1.32 : le pied de carte, qui reprend ce que disait « ce qui sonne ». Une seule ligne,
   collee sous les colonnes par un filet, et qui disparait d elle-meme quand il n y a rien
   a signaler — a la place, « rien ne presse », le seul endroit de la page qui le dise. */
.eqleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;padding-top:6px;
  border-top:1px solid var(--border);font-size:10.5px;color:var(--text3)}
.eqleg .e{display:flex;align-items:center;gap:5px;cursor:pointer;border-radius:4px;
  padding:1px 4px;margin:0 -4px}
.eqleg .e:hover{background:var(--surface2);color:var(--text2)}
.eqleg .e i{width:7px;height:7px;border-radius:2px;display:block;background:var(--border2)}
.eqleg .e.r i{background:var(--rouge-l)} .eqleg .e.r{color:var(--rouge);font-weight:600}
.eqleg .e.a i{background:var(--ambre-l)} .eqleg .e.a{color:var(--ambre);font-weight:600}
.eqleg .e.b i{background:var(--bleuf-l)} .eqleg .e.b{color:var(--bleuf)}
.eqleg .e.calme{cursor:default} .eqleg .e.calme i{background:var(--vert-l)}
.eqleg .e.calme:hover{background:none;color:var(--text3)}
/* v1.35 : l entrée « en sourdine ». Grise et sans relief : ce ne sont pas des lignes qui
   pèsent, ce sont celles qu on a décidé de ne plus voir. Mais elle reste sous les yeux —
   une sourdine qu on ne voit nulle part, personne ne pense à la réveiller. */
.eqleg .e.s i{background:var(--border2)} .eqleg .e.s{color:var(--text3)}

/* ---------- v1.35 : LE BLOC « EN SOURDINE » ---------- *
   Pleine largeur, en bas de page, en gris : demande d Olivier du 04/11/2026. Hors de la
   grille à trois colonnes parce qu il ne concurrence rien — on l atteint en descendant,
   ou par la pastille de l équaliseur. */
section.sourdine{margin-top:16px;background:var(--surface2)}
section.sourdine .shead{background:#f1f3f6}
.t-gris h2{color:var(--text2)}
.c-gris{background:#eef1f5;color:var(--text2)}
section.sourdine .row{background:transparent}

/* la fenêtre de mise en sourdine */
.mfond{position:fixed;inset:0;background:rgba(20,28,45,.42);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 22px;width:min(100%,470px);box-shadow:0 8px 28px rgba(20,30,50,.18)}
.mbox h3{margin:0 0 3px;font-size:14px}
.mbox .msub{margin:0 0 10px;font-size:12px;color:var(--text2);font-family:var(--mono)}
.mbox .maide{margin:0 0 14px;font-size:11.5px;color:var(--text3);line-height:1.6}
.mbox label{display:block;font-size:11px;color:var(--text3);font-weight:600;margin:0 0 4px}
.mbox select,.mbox textarea{width:100%;padding:7px 9px;border:1px solid var(--border);
  border-radius:var(--radius);font-size:12.5px;font-family:var(--sans);color:var(--text);
  background:#fff;margin-bottom:12px}
.mbox textarea{min-height:62px;resize:vertical}
.mbox select:focus,.mbox textarea:focus{outline:none;border-color:var(--orange)}
.mbox .merr{font-size:11.5px;color:var(--rouge);min-height:16px;margin-bottom:6px}
.mbox .macts{display:flex;gap:8px;justify-content:flex-end}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
/* v1.25 : les tuiles d outils prennent un fond, pour se distinguer des blocs de suivi.
   Un outil est une PORTE, pas une information : il ne doit pas ressembler a une carte. */
.tuile{display:flex;align-items:center;gap:11px;background:var(--ppblue-bg);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:13px 15px;text-decoration:none;color:var(--text);
  box-shadow:0 1px 2px rgba(20,30,50,.04)}
.tuile:hover{border-color:var(--orange);background:var(--ambre-bg)}
.tuile i{font-size:20px;color:var(--orange)}
.tuile .tt{font-size:12.5px;font-weight:600}
.tuile .ts{font-size:11px;color:var(--text3);margin-top:1px}

.msg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;color:var(--text2);font-size:12.5px;line-height:1.6}
.msg.err{border-left:4px solid var(--rouge)}
.bientot{margin-top:18px;background:var(--ppblue-bg);border:1px solid #cfe3e7;border-radius:var(--radius-lg);
  padding:13px 16px;color:var(--ppblue);font-size:12px;line-height:1.6}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--vert);color:#fff;font-weight:600;font-size:12.5px;
  padding:10px 20px;border-radius:24px;transition:transform .3s ease;z-index:99;
  box-shadow:0 4px 14px rgba(20,40,10,.2)}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <img src="achats/shared/picto-pp-fond-clair.png" alt="" width="24" height="24" style="object-fit:contain"
       onerror="this.style.display='none'">
  <span class="logo-text"><span class="lt">PROTO PROCESS</span><span class="ls">/</span><span class="lo">Mon tableau de bord</span></span>
  <span class="vbadge" id="vbadge"></span>
  <span class="spacer"></span>
  <span class="score" id="zscore" style="display:none"><i class="ti ti-check"></i> traités aujourd'hui <b id="score">0</b></span>
  <span class="moi" id="zmoi" style="display:none">
    <span class="nom" id="monnom"></span>
    <button onclick="changerDePersonne()">ce n'est pas moi</button>
  </span>
</header>

<div class="wrap wrap-urgent" id="wrap-urgent">
  <div class="urgent" id="urgent" hidden>
    <i class="ti ti-alert-triangle" aria-hidden="true"></i>
    <span id="urgent-txt"></span>
    <span class="so" id="urgent-so"></span>
  </div>
</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast">Traité</div>

<script>
/* ------------------------------------------------------------------ *
 * Mon tableau de bord — page de suivi par personne.
 *
 * Elle n'invente aucune règle : tout ce qu'elle affiche vient du service
 * « PP — Points a traiter », qui est aussi ce que lit le point du matin.
 * Une règle changée dans le service vaut pour le mail ET pour cette page.
 *
 * Entrée (décision Olivier du 29/10/2026) :
 *   - depuis le mail : le lien porte ?j=<jeton>, qui dit QUI tu es
 *   - depuis le hub  : le code d'accès PP ouvre la page, puis on choisit son nom
 *   - le code d'accès PP est exigé dans les deux cas : c'est lui qui protège
 *     les données client (NDA). Le jeton seul n'ouvre rien.
 *
 * v1.11 (02/11/2026) : la page a quitté le dépôt « achats » pour le dépôt
 * racine. Sur GitHub Pages le premier segment de l'URL est imposé par le
 * dépôt qui héberge le fichier : tant qu'elle vivait dans « achats », son
 * adresse disait « achats » — alors que tout le monde y passera à terme.
 *   avant  protoprocess.github.io/achats/ma-gestion/
 *   après  protoprocess.github.io/ma-gestion/
 * Les scripts partagés et le picto restent lus dans achats/shared/ : même
 * domaine, donc une seule source, aucune copie à maintenir.
 *
 * v1.13 (02/11/2026) : la page s'appelle « Mon tableau de bord ». L'adresse
 * ne bouge pas (/ma-gestion/) : le mail du matin pointe dessus et elle vient
 * d'être déplacée — on ne casse pas deux fois les liens dans la même journée.
 * Arrivée de la production et des méthodes : Fred, Stéphane, Jérôme et
 * Valérie peuvent ouvrir leur page. Les blocs qui ne pourront JAMAIS rien
 * contenir pour eux (affaires, devis) ne s'affichent pas — la colonne
 * Responsable du planning n'accepte que AC, DG, MM et OC, donc ces blocs
 * resteraient vides à vie. Règle Olivier du 22/10 : ce qui ne demande aucun
 * geste ne s'affiche pas.
 *
 * v1.14 (02/11/2026, constats d'Olivier à l'usage) :
 *   1. « Je m'en occupe » ouvrait Achats PP DANS cette page : on perdait son
 *      tableau de bord pour y revenir ensuite. Le lien s'ouvre maintenant dans
 *      un nouvel onglet — la page reste là, derrière.
 *   2. il fallait RETAPER le SO une fois dans Achats PP, alors qu'on venait de
 *      cliquer sur une ligne qui le dit. Le lien porte désormais ?so=…&onglet=achats,
 *      et Achats PP v15.47 charge la feuille d'achat tout seul.
 *   3. nouveau bloc « MES COMMANDES À FACTURER » (service « PP — Commandes a
 *      facturer (page) »). Règle Olivier du 30/10 : facturer 2 ou 3 jours après
 *      la livraison n'est PAS un retard — la ligne reste grise, et ne s'allume
 *      qu'au-delà de 5 jours ouvrés, ou les 3 derniers jours du mois, moment où
 *      la facturation devient sensible. C'est un rappel, pas une alerte.
 *
 * v1.15 (02/11/2026, demande Olivier) : TOUS les blocs en demi-page, dans la
 * même grille à deux colonnes — comme « ce qui attend un geste » et « mes devis
 * à traiter » l'étaient déjà. Un bloc pleine largeur fait traverser l'écran pour
 * lire trois mots, et repousse les suivants sous la ligne de flottaison.
 *
 * v1.16 (02/11/2026) : LES COURBES, en bande fine sous les compteurs (service
 * « PP — Courbes (page) », mesures écrites par « PP — Photos du matin »). Six
 * semaines. Deux d'entre elles sont personnelles (la pile, les devis dans les
 * temps), la troisième est une courbe d'ÉQUIPE : passé quelques jours, le SO
 * quitte le planning et plus rien ne dit qui le portait — 55 lignes sur 60 non
 * attribuables sur 6 semaines. Elle est aussi montrée à la production, qui la
 * fabrique (demande d'Olivier : « tu l'ajouteras au tableau de bord de Fred »).
 *
 * v1.17 (02/11/2026) : tolérance d'un jour ouvré sur les livraisons — une
 * expédition le lendemain de la date promise reste « dans les temps ». Le taux
 * des 6 dernières semaines passe de 81 % à 88 %.
 *
 * v1.18 (02/11/2026) : bloc « AR CLIENT — DATE PROMISE ». L accusé qu'on envoie au
 * client, le pendant du bloc AR fournisseur. Détection sur DEUX signaux (modèle Odoo
 * ou réponse dans le fil du client) : avec le seul modèle, le bloc aurait crié au loup
 * 34 fois sur 500 commandes. Services n8n « PP — AR client : balayage » et
 * « PP — AR client : page ».
 * ------------------------------------------------------------------
 *
 * v1.21 (03/11/2026) : l anneau des livraisons a l heure est visible par TOUT LE MONDE,
 *   methodes comprises (voir voitLesCourbes). C est un resultat collectif : le cacher a
 *   une partie de l equipe reviendrait a dire que le chiffre n est pas le sien.
 *
 * v1.20 (02/11/2026) : REFONTE DE LA MISE EN PAGE, apres maquette validee par Olivier.
 *   - LES OUTILS EN PREMIER. « Je trouve plus logique les outils en haut » : cette page
 *     est la page d accueil, on y arrive pour faire quelque chose, et la production (deux
 *     blocs en tout) devait defiler avant d atteindre ses outils.
 *   - TROIS BLOCS PAR LIGNE au lieu de deux, TROIS LIGNES par bloc puis « Voir les N
 *     autres ». A trois colonnes, un bloc qui deroule dix lignes decale tout le reste.
 *   - LES INDICATEURS ET LES ALERTES SUR LA MEME BANDE : les trois mesures a gauche,
 *     « ce qui sonne » a droite. Avant : deux bandes pleines pour cinq chiffres.
 *   - LES LIVRAISONS PASSENT EN ANNEAU (voir carteCourbe). La pile garde sa courbe : la
 *     pente est ce qu elle a d utile. Les devis n ont pas encore d historique.
 *   - ORDRE des blocs pour le commercial, donne par Olivier : ce qui attend un geste,
 *     mes devis, AR client / a facturer, commandes fournisseur, pense-bete.
 *   - « P.O. sans affaire » ne concerne plus que la direction et Fred.
 *
 * v1.19 (02/11/2026) : CETTE PAGE EST DESORMAIS LA PAGE D ACCUEIL.
 * Elle a quitte /ma-gestion/ pour la racine et remplace l ancien hub (v2.7), qui
 * est supprime. /ma-gestion/ redirige ici.
 *
 * Pourquoi : il y avait DEUX portes d entree qui ne disaient pas la meme chose. Le hub
 * montrait toutes les tuiles a tout le monde, sans filtre ; le tableau de bord filtrait
 * les outils par pole. Le constat d Olivier du 02/11 au soir : « donc Stephane a acces a
 * l appli P.O. ?! » — oui, par le hub, alors que son propre tableau de bord ne lui
 * proposait pas la tuile. Deux endroits decidaient, ils se contredisaient. Un seul
 * decide maintenant.
 *
 * Recupere du hub : le bandeau URGENT (stock critique), la ligne « autres outils »,
 * l ecriture de pp_personne et la mesure de deroule.
 * NON repris : les compteurs de tuiles de l ancien hub (devis a faire, commandes a
 * saisir). Ils etaient calcules pour TOUTE l equipe, alors que cette page dit a chacun
 * ce qui l attend, lui — un compteur collectif a cote d un decompte personnel se
 * contredirait. Le bloc « A toi de jouer » n est pas repris non plus : il avait ete
 * retire du hub des la v2.1, il n existait plus.
 * ------------------------------------------------------------------ */
const APP_VERSION = "1.35";
const APP_DATE    = "04/11/2026";
document.getElementById('vbadge').textContent = "v" + APP_VERSION + " — " + APP_DATE;
document.title = "Mon tableau de bord v" + APP_VERSION;

const SERVICE  = 'https://protoprocess.app.n8n.cloud/webhook/pp-points-a-traiter';
const SOURDINE = 'https://protoprocess.github.io/achats/sourdine/';
/* v1.35 : la porte du TABLEAU DE BORD pour poser ou réveiller une sourdine.
   SOURDINE ci-dessus reste la page publique à jeton, ouverte depuis le mail du matin ;
   les deux cohabitent et écrivent dans la même table. La différence : d ici on sait QUI
   clique, donc on peut exiger une justification et proposer un réveil. */
const SOURDINE_BORD = 'https://protoprocess.app.n8n.cloud/webhook/pp-sourdine-bord';
const GMAIL    = 'https://mail.google.com/mail/u/0/#inbox/';
const RACINE   = 'https://protoprocess.github.io/';
const CLE_MOI  = 'pp_ma_gestion_qui';
/* Le hub ecrivait le PRENOM sous une autre cle, et la mesure de deroule s en sert.
   On continue de l ecrire pour ne pas casser la mesure ni les applis qui la lisent. */
const CLE_PERSONNE = 'pp_personne';
const SB_URL = 'https://gzljssjjrqbxgnxugiqu.supabase.co/rest/v1';
const SB_KEY = 'sb_publishable_2-umPRDkyFtqcHhaqWAMoA_5IerFc0O';

/* ---------- repris de l ancien hub (v1.19) ---------- */

/* Marque « arrivé par l accueil » : lue par achats/shared/retour-accueil.js dans chaque
   appli, qui s en sert pour afficher le bouton de retour. Sans elle, les applis perdent
   le chemin du retour. */
try { sessionStorage.setItem('pp_accueil_url', location.origin + location.pathname); } catch (e) {}

/* Session : regroupe les mesures d un même passage (accueil puis appli). */
let SESSION = null;
try {
  SESSION = localStorage.getItem('pp_session')
    || (Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
  localStorage.setItem('pp_session', SESSION);
} catch (e) { SESSION = 'x'; }

/* Mesure de déroulé. Tir et oubli : si ça échoue, la page n en sait rien et s en fiche. */
function mesure(appli, evenement, etape) {
  let personne = null;
  try { personne = localStorage.getItem(CLE_PERSONNE); } catch (e) {}
  try {
    fetch(SB_URL + '/deroule_mesures', {
      method: 'POST', keepalive: true,
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ personne: personne, appli: appli, evenement: evenement,
                             etape: etape || null, session_id: SESSION })
    }).catch(() => {});
  } catch (e) {}
}

/* Bandeau URGENT : les SO en stock critique (composant quasi introuvable), un lien par SO.
   Lecture publique de Supabase, hors du service.

   v1.28 (03/11/2026, demande d Olivier) : le bandeau ne montre QUE les affaires de la
   personne. Il s affichait à tout le monde, si bien que chacun voyait des SO qui ne le
   concernaient pas — et que personne ne se sentait visé. La direction continue de tout voir.

   Le filtre se fait sur les SO que le service rend pour cette personne. Conséquence
   assumée : une affaire en stock critique qui n apparaîtrait dans aucun de ses deux blocs
   ne serait pas montrée. En pratique un stock critique fait toujours remonter l affaire. */
let URGENTS = null;
fetch(SB_URL + '/v_appro_urgent?select=*', { headers: { apikey: SB_KEY } })
  .then(r => r.ok ? r.json() : [])
  .then(rows => { URGENTS = rows || []; majUrgent(); })
  .catch(() => { URGENTS = []; majUrgent(); });

function majUrgent() {
  const el = document.getElementById('urgent');
  const wrap = document.getElementById('wrap-urgent');
  if (!el || URGENTS === null) return;

  let rows = URGENTS;
  // Tant qu on ne sait pas qui regarde, on ne montre rien : mieux vaut un bandeau qui
  // arrive une seconde plus tard qu un bandeau qui parle des affaires d un autre.
  if (!MOI) rows = [];
  else if (POLE_DE[MOI] !== 'direction') {
    const d = (DONNEES || []).find(x => x.initiales === MOI);
    const miens = new Set([].concat((d && d.affaires_a_geste) || [], (d && d.affaires_calmes) || [])
                            .map(a => String(a.so)));
    rows = rows.filter(r => miens.has(String(r.so)));
  }

  if (!rows.length) { el.hidden = true; wrap.classList.add('vide'); return; }
  wrap.classList.remove('vide');
  el.querySelector('#urgent-txt').textContent = 'URGENT — ' + rows.length + ' commande'
    + (rows.length > 1 ? 's' : '') + ' en stock critique (composant quasi introuvable) :';
  el.querySelector('#urgent-so').innerHTML = rows.map(r =>
    '<a href="' + esc(r.report_url || (RACINE + 'achats/bom-sourcing/')) + '" target="_blank" rel="noopener">'
    + esc(r.so) + '<small>' + r.nb_stock_critique + ' ligne'
    + (r.nb_stock_critique > 1 ? 's' : '') + '</small></a>').join('');
  el.hidden = false;
}

/* Clic sur une tuile d outil : début de déroulé. Délégation, parce que les tuiles sont
   réécrites à chaque rendu. */
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('[data-appli]');
  if (a) mesure(a.dataset.appli, 'debut');
});

/* Les pôles, tels qu'Ariel les a décrits le 20/10/2026. Les adresses et les
   libellés sont repris du hub, pour que personne n'ait à réapprendre un nom. */
const POLES = {
  direction:         { nom: 'Direction',            outils: ['devis','commande','achats','po','reception','fabstory','methodes','controle','paie'] },
  commercial_achats: { nom: 'Commercial et achats',  outils: ['devis','commande','achats','po','fabstory'] },
  production:        { nom: 'Gestion de production', outils: ['fabstory'] },
  methodes:          { nom: 'Méthodes',              outils: ['reception','fabstory','methodes'] }
};

/* v1.19 : AJUSTEMENT PAR PERSONNE, par-dessus le pôle.
   Le pôle seul ne suffit plus. Décision d'Olivier du 02/11/2026 au soir : Stéphane et Fred
   passent les P.O. de consommable et de sous-traitance, Valérie est dans le même pôle et ne
   les passe pas. Fred réceptionne et contrôle, Stéphane ni l'un ni l'autre. Une règle par
   pôle ne sait pas dire ça.
   Ce qui s'ajoute au pôle, et ce qui s'en retire. Ordre d'application : pôle, puis EN_PLUS,
   puis EN_MOINS — le retrait gagne toujours. */
const EN_PLUS = {
  SG: ['po'],                          // consommable et sous-traitance, filtré dans l'appli P.O.
  FR: ['po','reception','controle'],
  VF: ['controle']
};
const EN_MOINS = {
  MM: ['reception'], DG: ['reception'], AC: ['reception']   // « Réceptionner : pas le service commercial »
};

const OUTILS = {
  devis:     { t: 'Créer un devis',        s: "Dossier client jusqu'au devis Odoo", i: 'ti-file-text',          u: 'commercial/devis-client/' },
  commande:  { t: 'Commande client',       s: "Bon de commande reçu d'un client",   i: 'ti-clipboard-check',    u: 'commercial/commande/' },
  achats:    { t: 'Approvisionner',        s: 'Achats PP',                          i: 'ti-shopping-cart',      u: 'achats/bom-sourcing/' },
  po:        { t: "Commande d'achat",      s: 'P.O. fournisseur dans Odoo',         i: 'ti-receipt',            u: 'achats/po-odoo/' },

/* Une courbe en SVG, sans bibliothèque : une ligne, un remplissage léger, rien d autre.
   Un seul point ne fait pas une courbe : on affiche alors un repère plat. */
function sparkline(vals, max, couleur) {
  if (!vals.length) return '';
  const L = 240, H = 46, m = max || Math.max(1, ...vals);
  const x = i => vals.length < 2 ? L : (i / (vals.length - 1)) * L;
  const y = v => H - 3 - (Math.max(0, Math.min(v, m)) / m) * (H - 8);
  const pts = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
  const ligne = vals.length < 2
    ? '<line x1="0" y1="' + y(vals[0]).toFixed(1) + '" x2="' + L + '" y2="' + y(vals[0]).toFixed(1)
      + '" stroke="' + couleur + '" stroke-width="2" stroke-dasharray="3 3"/>'
    : '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + couleur
      + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const aire = vals.length < 2 ? ''
    : '<polygon points="0,' + H + ' ' + pts.join(' ') + ' ' + L + ',' + H + '" fill="' + couleur + '" opacity=".10"/>';
  const dernier = vals.length < 2 ? '' :
    '<circle cx="' + x(vals.length - 1).toFixed(1) + '" cy="' + y(vals[vals.length - 1]).toFixed(1)
    + '" r="2.6" fill="' + couleur + '"/>';
  return '<svg class="spark" viewBox="0 0 ' + L + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">'
       + aire + ligne + dernier + '</svg>';
}

/* v1.20 : l ANNEAU des livraisons. Une courbe de pourcentage ment dans les deux sens —
   echelle 0-100 elle est plate, echelle automatique un ecart de deux points ressemble a
   une falaise. Et surtout elle cache le volume : 88 % sur 59 cartes et 88 % sur 4 cartes
   ne valent pas la meme chose.
   L anneau repond a une autre question, la bonne : DE QUOI sont faits les echecs. Rater
   d un jour ou rater de deux semaines, ce n est pas le meme metier.
   Trois parts, le chiffre au centre. Les couleurs different aussi en CLARTE, pas seulement
   en teinte : lues en noir et blanc ou par un oeil qui confond les rouges et les verts,
   elles restent distinctes. */
function anneau(parts, centre) {
  const R = 26, C = 2 * Math.PI * R, total = parts.reduce((s, p) => s + p.n, 0);
  let a = 0, arcs = '';
  if (!total) {
    arcs = '<circle cx="32" cy="32" r="' + R + '" fill="none" stroke="#e4e7ec" stroke-width="10"/>';
  } else {
    for (const p of parts) {
      if (!p.n) continue;
      const len = (p.n / total) * C;
      arcs += '<circle cx="32" cy="32" r="' + R + '" fill="none" stroke="' + p.c
            + '" stroke-width="10" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2)
            + '" stroke-dashoffset="' + (-a).toFixed(2) + '" transform="rotate(-90 32 32)"/>';
      a += len;
    }
  }
  const lu = parts.filter(p => p.n).map(p => p.n + ' ' + p.t).join(', ');
  let h = '<div class="anneau">';
  h += '<svg viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="'
     + esc(centre + '. ' + (lu || 'aucune mesure')) + '">' + arcs
     + '<text x="32" y="32" text-anchor="middle" dominant-baseline="central" '
     + 'font-size="15" font-weight="700" fill="#1b2232">' + esc(centre) + '</text></svg>';
  h += '<div class="leg">';
  for (const p of parts) {
    h += '<div><i style="background:' + p.c + '"></i>' + p.n + ' ' + esc(p.t) + '</div>';
  }
  h += '</div></div>';
  return h;
}

function carteCourbe(titre, valeur, sous, vals, max, couleur, infobulle) {
  // v1.20 : couleur = 'ANNEAU' remplace la courbe par un anneau a deux parts, vals valant
  // alors [ce qui va, ce qui rate]. Le chiffre va AU CENTRE de l anneau et non au-dessus :
  // un pourcentage et son anneau repetes l un sous l autre, c est la meme chose dite deux
  // fois. Le sous-titre, lui, porte le volume, qui est la vraie information manquante.
  if (couleur === 'ANNEAU') {
    const centre = String(valeur).replace(/<[^>]*>/g, '').replace(/\s+/g, '');
    return '<div class="courbe"' + (infobulle ? ' title="' + esc(infobulle) + '"' : '') + '>'
         + '<div class="ct">' + esc(titre) + '</div>'
         + anneau([ { n: vals[0] || 0, t: 'a l heure', c: '#4A7C3F' },
                    { n: vals[1] || 0, t: 'en retard', c: '#C4651F' } ], centre)
         + '<div class="cs">' + esc(sous) + '</div></div>';
  }
  return '<div class="courbe"' + (infobulle ? ' title="' + esc(infobulle) + '"' : '') + '>'
       + '<div class="ct">' + esc(titre) + '</div>'
       + '<div class="cv">' + valeur + '</div>'
       + sparkline(vals, max, couleur)
       + '<div class="cs">' + esc(sous) + '</div></div>';
}

/* ---------- v1.31 : L EQUALISEUR DE CHARGE ---------- *
 * Demande d Olivier du 03/11/2026 au soir, en remplacement de la courbe « ma pile » :
 * « je verrais plus un truc genre equalizer […] une pastille = un dossier […] il faut
 * combiner delai et comptage, parce que le nombre c est bien mais le timing aussi
 * important voire plus ».
 *
 *   UNE COLONNE  = un bloc de la page    -> la hauteur dit le VOLUME
 *   UNE PASTILLE = une ligne de ce bloc  -> la couleur dit le DELAI
 *   empilees depuis le bas, les plus urgentes en bas : la base rouge saute aux yeux.
 *
 * L EQUALISEUR LIT LE DOM, PAS LES DONNEES. C est volontaire, et c est tout l interet :
 * chaque bloc rend deja ses lignes avec leur niveau (rouge, orange, bleu, gris), calcule
 * par le service. En comptant ces lignes-la, l equaliseur ne PEUT PAS diverger de ce que
 * la page affiche — c etait exactement le defaut de l ancienne courbe, qui mesurait autre
 * chose dans son coin. Aucun seuil nouveau n est invente ici.
 *
 * Les blocs arrivent les uns apres les autres (un fetch chacun) : un MutationObserver sur
 * la grille redessine l equaliseur a chaque bloc rempli. Il observe la GRILLE et non #app,
 * qui contient aussi l equaliseur — il se redessinerait lui-meme sans fin.
 *
 * Les commandes fournisseur sont volontairement absentes (Olivier : « trop rare et inutile
 * ici »), comme le menage des P.O. et le pense-bete, qui n est pas une charge subie.
 * ---------------------------------------------------------------- */
const POSTES = [
  { bloc: 'bloc-appro',    lib: 'mon geste',    nom: 'Ce qui attend ton geste' },
  { bloc: 'bloc-demandes', lib: 'à prendre',    nom: 'Demandes de prix à prendre' },
  { bloc: 'bloc-devis',    lib: 'devis',        nom: 'Mes devis à traiter' },
  { bloc: 'bloc-arclient', lib: 'AR client',    nom: 'AR client manquant' },
  { bloc: 'bloc-facturer', lib: 'à facturer',   nom: 'Mes commandes à facturer' },
  { bloc: 'bloc-dossiers', lib: 'mes dossiers', nom: 'Mes dossiers à préparer' }
];
/* Hauteur de la carte : 122 px, celle des deux autres cartes de la bande — demande d Olivier,
   « limite en hauteur comme pour les courbes actuelles pour garder une symetrie et de la
   coherence dans la page ». Huit pastilles de 5 px et leurs interstices tiennent dans les
   54 px restants. Au-dela de huit dossiers la pastille du haut s estompe pour dire que la
   colonne est coupee ; le total, lui, reste entier juste au-dessus. */
const EQ_MAX  = 8;
const EQ_RANG = { rouge: 0, orange: 1, bleu: 2, gris: 3, vert: 4 };
const EQ_LET  = { rouge: 'r', orange: 'a', bleu: 'b', gris: 'g', vert: 'g' };

function nivDeLigne(row) {
  for (const n of ['rouge', 'orange', 'bleu', 'vert', 'gris'])
    if (row.classList.contains(n)) return n;
  return 'gris';
}

function carteCharge() {
  // Au premier rendu les blocs sont encore vides : la carte sort avec ses colonnes a zero
  // et se remplit ensuite. Mieux qu un trou qui apparait trois secondes plus tard.
  return '<div class="courbe eq" id="carte-charge"'
       + ' title="Une pastille par dossier, empilées de la plus urgente à la plus calme.">'
       + '<div class="ct">MA CHARGE</div><div class="eqcols" id="eqcols"></div>'
       + '<div class="eqleg" id="eqleg"></div></div>';
}

function majCharge() {
  const z = document.getElementById('eqcols');
  if (!z) return;
  let h = '';
  const total = {};   // cumul par niveau, toutes colonnes confondues, pour le pied de carte
  for (const p of POSTES) {
    const sec = document.getElementById(p.bloc);
    if (!sec) continue;   // bloc absent pour ce pole : pas de colonne
    // .row:not(.sup) : on ecarte les lignes que le bloc tient hors de son compte — les
    // affaires « a garder a l oeil », les demandes deja reglees. Elles portent .sup sur la
    // ligne elle-meme, alors que les lignes simplement repliees par capper vivent DANS un
    // conteneur .sup et comptent, elles. Sans cette nuance l equaliseur affichait 12 la ou
    // l en-tete du bloc affichait 11 : exactement l ecart qu on cherche a supprimer.
    const nivs = [].map.call(sec.querySelectorAll('.row:not(.sup)'), nivDeLigne)
                   .sort((a, b) => EQ_RANG[a] - EQ_RANG[b]);
    const n = nivs.length;
    nivs.forEach(x => { total[x] = (total[x] || 0) + 1; });
    // Le CHIFFRE porte la couleur de la colonne entiere : vert quand rien ne presse. C est
    // le seul endroit de la page ou « tout va bien » se voit positivement, au lieu de se
    // deduire d une absence de rouge.
    const pire = n ? nivs[0] : null;
    const cc = !n ? 'z' : pire === 'rouge' ? 'r' : pire === 'orange' ? 'a' : 'v';
    // false : un clic de COLONNE ne deplie pas le bloc. Il visait toutes les lignes, donc
    // il depliait tout et le bloc restait a six lignes — « ce qui attend un geste toujours
    // trop de lignes ». Il emmene au bloc et encadre ce qui est visible, rien de plus.
    h += '<div class="col ' + cc + '" onclick="allerVers(\'' + p.bloc + '\',\'\',false)"'
       + ' title="' + esc(p.nom) + ' — ' + n + ' dossier' + (n > 1 ? 's' : '') + '">';
    h += '<div class="n">' + n + '</div><div class="pile">';
    nivs.slice(0, EQ_MAX).forEach((niv, i) => {
      const coupe = n > EQ_MAX && i === EQ_MAX - 1;
      h += '<i class="' + EQ_LET[niv] + (coupe ? ' tronq' : '') + '"></i>';
    });
    h += '</div><div class="lib">' + esc(p.lib) + '</div></div>';
  }
  z.innerHTML = h;

  // v1.32 : LE PIED DE L EQUALISEUR reprend ce que disait « ce qui sonne », mais sur
  // TOUTES les colonnes et non sur les seules affaires. Chaque entree reste cliquable :
  // elle encadre ses lignes partout ou elles se trouvent, et emmene a la premiere.
  const l = document.getElementById('eqleg');
  if (l) {
    const parts = [];
    [['rouge', 'en danger'], ['orange', 'ça presse'], ['bleu', 'info manque']].forEach(x => {
      const n = total[x[0]] || 0;
      if (!n) return;
      parts.push('<span class="e ' + EQ_LET[x[0]] + '" onclick="viserNiveau(\'' + x[0] + '\')"'
               + ' title="Encadrer ces ' + n + ' lignes"><i></i>' + n + ' ' + x[1] + '</span>');
    });
    // v1.35 : la sourdine se dit ici, en gris, à côté des trois niveaux. Elle ne compte pas
    // comme une charge — c est le contraire : ce sont les lignes qu on a décidé de ne plus
    // voir. Mais elle reste sous les yeux : une sourdine invisible, personne ne la réveille.
    const dort = mesSourdines().length;
    if (dort) parts.push('<span class="e s" onclick="allerVers(\'bloc-sourdine\',\'\',false)"'
      + ' title="Voir les affaires en sourdine"><i></i>' + dort + ' en sourdine</span>');

    l.innerHTML = parts.length ? parts.join('')
      : '<span class="e calme"><i></i>rien ne presse</span>';
  }

  // Aucun poste pour ce pole — la production, par exemple, n a ni affaires ni devis ici :
  // la carte disparait au lieu de montrer un cadre vide intitule « ma charge ».
  const c = document.getElementById('carte-charge');
  if (c) c.style.display = h ? '' : 'none';
}

/* v1.32 : le clic d une entree du pied de carte. Un niveau ne vit pas dans un seul bloc —
   « en danger » se trouve aussi bien dans les affaires que dans les AR client. On encadre
   donc partout, et on emmene a la premiere ligne trouvee. Sans deplier : le pied dit un
   nombre, pas une liste a derouler. */
function viserNiveau(niv) {
  document.querySelectorAll('.row.vise').forEach(r => r.classList.remove('vise'));
  const cibles = [];
  for (const p of POSTES) {
    const sec = document.getElementById(p.bloc);
    if (!sec) continue;
    [].forEach.call(sec.querySelectorAll('.row.' + niv + ':not(.sup)'), r => cibles.push(r));
  }
  if (!cibles.length) return;
  const visible = cibles.filter(r => r.offsetParent !== null);
  (visible[0] || cibles[0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
  cibles.forEach(r => r.classList.add('vise'));
  setTimeout(() => cibles.forEach(r => r.classList.remove('vise')), 3100);
}

/* Les blocs se remplissent chacun a leur rythme, un fetch chacun. */
let EQ_OBS = null;
function suivreLaCharge() {
  const g = document.querySelector('.grille');
  if (!g) return;
  if (EQ_OBS) EQ_OBS.disconnect();
  let t = null;
  EQ_OBS = new MutationObserver(() => {
    clearTimeout(t);
    t = setTimeout(majCharge, 60);   // un seul redessin quand plusieurs blocs tombent ensemble
  });
  EQ_OBS.observe(g, { childList: true, subtree: true });
  majCharge();
}

function bandeCourbes(d) {
  const pile = (d && d.pile) || [];
  const devis = (d && d.devis) || [];
  const liv = (d && d.livraisons) || [];
  let h = '';

  // v1.31 : LA COURBE « MA PILE » EST REMPLACEE PAR L EQUALISEUR DE CHARGE (carteCharge).
  // Elle comptait des couples SO x motif de l appro, releves a 6h10 : 7 points quand la page
  // en affichait 18, et aucun moyen de rapprocher les deux. Olivier, 03/11 : « je comprend
  // pas le chiffre ma pile ». L equaliseur compte les lignes que la page montre, en direct.
  h += carteCharge();

  if (voitLesAffaires()) {
    const vals = devis.map(s => Math.round(s.ok / Math.max(1, s.n) * 100));
    const n = devis.reduce((t, s) => t + s.n, 0);
    const ok = devis.reduce((t, s) => t + s.ok, 0);
    h += carteCourbe('DEVIS DANS LES TEMPS',
                     n ? Math.round(ok / n * 100) + ' <span>%</span>' : '—',
                     n ? n + ' demande' + (n > 1 ? 's' : '') + ' traitée' + (n > 1 ? 's' : '')
                       : 'mesure commencée le ' + frDate(d.devis_depuis),
                     vals, 100, '#3b7ea1',
                     'Délai entre le mail du client et le moment où le fil sort de « mes devis à traiter ». '
                     + 'Dans les temps = 2 jours ouvrés ou moins.');
  }

  // v1.20 : les livraisons passent de la COURBE a l ANNEAU (decision Olivier du 02/11).
  // Une courbe de pourcentage ment dans les deux sens : echelle 0-100 elle est plate,
  // echelle automatique un ecart de deux points ressemble a une falaise. Et elle cache le
  // volume, alors que 88 % sur 59 cartes et 88 % sur 4 cartes ne valent pas la meme chose.
  // L anneau montre le volume et la part qui rate. Deux parts aujourd hui : la mesure ne
  // separe pas encore « a l heure » de « a J+1 », comptes ensemble dans a_l_heure. La
  // troisieme part viendra quand la photo du matin de 6h10 saura les distinguer.
  const nL = liv.reduce((t, s) => t + s.n, 0);
  const okL = liv.reduce((t, s) => t + s.ok, 0);
  h += carteCourbe('LIVRAISONS À L\u2019HEURE',
                   nL ? Math.round(okL / nL * 100) + ' <span>%</span>' : '—',
                   nL ? nL + ' cartes livrées · toute l\u2019équipe' : 'pas encore de livraison mesurée',
                   [okL, nL - okL], 0, 'ANNEAU',
                   'Une ligne carte est à l\u2019heure si elle part au plus tard à la date promise de sa ligne '
                   + 'dans Odoo, plus un jour ouvré de tolérance. Chiffre d’équipe, semaine par semaine.');
  return h;
}

/* ---------- mes commandes à facturer ---------- *
 * Source : Odoo, champ natif « invoice_status = à facturer » — il reste du livré non
 * facturé sur la commande. Rien n est recalculé ici.
 *
 * Règle Olivier du 30/10/2026 : facturer 2 ou 3 jours après la livraison n est PAS un
 * retard, ça ne devient sensible qu en fin de mois. Le bloc est donc un rappel de
 * tableau de bord : gris par défaut, ambre au-delà de 5 jours ouvrés depuis la
 * livraison, et ambre partout les 3 derniers jours du mois.
 *
 * La direction voit en plus les commandes dont le planning ne dit pas le responsable
 * (affaires anciennes, soldes) : sans ça elles ne seraient sur l écran de personne.
 * ------------------------------------------------------------------ */
const FACTURER = 'https://protoprocess.app.n8n.cloud/webhook/pp-facturer-liste';

async function chargerFacturer() {
  const z = document.getElementById('bloc-facturer');
  if (!z) return;
  z.innerHTML = '<div class="msg"><i class="ti ti-loader"></i> Lecture des commandes à facturer…</div>';
  try {
    const r = await fetch(FACTURER, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ source: 'ma-gestion-de-projets', version: APP_VERSION,
                                                             qui: MOI, direction: POLE_DE[MOI] === 'direction' }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    z.innerHTML = blocFacturer(await r.json());
  } catch (e) {
    z.innerHTML = '<div class="msg err">Les commandes à facturer n ont pas pu être lues (' + esc(e.message)
                + '). Le reste de la page est à jour.</div>';
  }
}

const euros = n => (Math.round(Number(n) || 0)).toLocaleString('fr-FR') + ' €';

function blocFacturer(d) {
  const mien = (d && d.lignes) || [];
  const sans = (d && d.sans_responsable) || [];
  const n = mien.length + sans.length;
  const chaud = mien.concat(sans).some(l => l.niveau === 'orange');
  let h = entete(chaud ? 't-crit' : 't-ok', '', 'MES COMMANDES À FACTURER', n,
                 n ? '<span class="quoi">' + euros(d.montant_total) + ' HT</span>' : '');
  if (!n) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Rien à facturer. Tout est à jour.</div>';
    return h;
  }
  if (d.fin_de_mois)
    h += '<div class="dater">Fin de mois : ce qui est livré devrait partir en facture avant la clôture.</div>';
  h += capper(mien.map(l => ligneFacturer(l, false)), 'commande');
  if (sans.length) h += sans.map(l => ligneFacturer(l, true)).join('');
  return h;
}

function ligneFacturer(l, orpheline) {
  // v1.31 : troisieme cran, comme pour l AR client. Au-dela de 10 jours ouvres depuis la
  // livraison, la facture est en retard pour de bon : ce n est plus un reste a faire, c est
  // de la tresorerie qui dort.
  const niv = Number(l.jours) > 10 ? 'rouge' : l.niveau === 'orange' ? 'orange' : 'gris';
  let h = '<div class="row ' + niv + '">';
  h += '<div class="l1"><span class="so">' + esc(l.so) + '</span>';
  if (l.client) h += '<span class="sep">·</span><span class="cli">' + esc(l.client) + '</span>';
  h += '<span class="badge b-' + niv + '">' + euros(l.montant) + '</span></div>';

  h += '<div class="l2"><span class="pastille p-' + niv + '">'
     + (l.livre_le ? 'livré le ' + frDate(l.livre_le) : 'livraison partielle') + '</span>';
  h += '<span class="quoi">'
     + (l.jours === null || l.jours === undefined ? 'reste du livré non facturé'
        : l.jours === 0 ? 'livré aujourd hui'
        : l.jours + ' jour' + (l.jours > 1 ? 's' : '') + ' ouvré' + (l.jours > 1 ? 's' : '') + ' depuis la livraison')
     + (orpheline ? ' · pas de responsable au planning' : '') + '</span>';
  h += '<span class="acts">';
  h += '<a class="btn-p" target="_blank" rel="noopener" href="' + esc(l.lien_odoo) + '">Facturer dans Odoo</a>';
  h += '</span></div></div>';
  return h;
}

/* ---------- mes dossiers à préparer (pôle méthodes) ---------- *
 * Demandé par Jérôme le 03/11/2026, en lecture seule.
 *
 * CE QUI S AFFICHE : les lignes du planning PP MYGPAO (onglet « Cmd En cours ») dont la
 * colonne M « Prog. / Dossier » vaut AF, VERIF ou MODIF. La ligne sort d elle-même dès que
 * Jérôme passe cette colonne à MY+EX, OK REFAB ou OK MODIF — aucun bouton « c est fait » ici :
 * il aurait fallu écrire dans le planning de tout le monde pour un geste qu il fait déjà.
 *
 * POURQUOI LA DATE ARC ET PAS LE PLANNING ATELIER. On avait d abord retenu « la première case
 * MY donne l ordre, puisque c est la prod qui arbitre selon les composants reçus ». Le premier
 * passage sur les vraies lignes l a démenti le 03/11 : sur 35 dossiers à faire, AUCUN ne portait
 * de case MY. Fred ne programme la prod qu une fois le dossier prêt — le MY arrive donc APRÈS
 * Jérôme et ne pouvait rien classer. L ordre vient de la date ARC (colonne C), seule colonne
 * renseignée presque partout. MY et TR restent affichés quand ils existent : ils disent ce qui
 * suit, pas ce qui presse.
 *
 * Les trois liens (projet Odoo, FabStory, Luminovo) sont repris tels quels des cellules A, F
 * et E du planning : aucune adresse n est reconstruite ici.
 *
 * Le niveau d urgence et les seuils sont calculés dans le workflow, pas ici : c est une règle
 * métier, elle se change à un seul endroit.
 * ------------------------------------------------------------------ */
const DOSSIERS = 'https://protoprocess.app.n8n.cloud/webhook/pp-dossiers-methodes';

function voitSesDossiers() { return POLE_DE[MOI] === 'methodes'; }

async function chargerDossiers() {
  const z = document.getElementById('bloc-dossiers');
  if (!z) return;
  z.innerHTML = '<div class="msg"><i class="ti ti-loader"></i> Lecture du planning…</div>';
  try {
    const r = await fetch(DOSSIERS, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ source: 'ma-gestion-de-projets', version: APP_VERSION, qui: MOI }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    z.innerHTML = blocDossiers(await r.json());
  } catch (e) {
    z.innerHTML = '<div class="msg err">Les dossiers à préparer n ont pas pu être lus (' + esc(e.message)
                + '). Le reste de la page est à jour.</div>';
  }
}

function blocDossiers(d) {
  const l = (d && d.dossiers) || [];
  const chaud = (d && d.nb_rouge) > 0;
  let h = entete(chaud ? 't-crit' : 't-ok', '', 'MES DOSSIERS À PRÉPARER', l.length, '');
  if (!l.length) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Aucun dossier en attente. Tout est à jour.</div>';
    return h;
  }
  h += capper(l.map(ligneDossier), 'dossier');
  return h;
}

function ligneDossier(x) {
  const n = x.niveau || 'gris';
  // Le badge dit la date promise au client et ce qu il reste pour y arriver. Une date
  // dépassée se dit en clair : la laisser en « dans -3 j » obligerait à faire le calcul.
  let quand;
  if (x.jours === null || x.jours === undefined) quand = esc(x.date_arc_brut || 'pas de date');
  else if (x.jours < 0)  quand = 'en retard de ' + (-x.jours) + ' j';
  else if (x.jours === 0) quand = "aujourd hui";
  else if (x.jours === 1) quand = 'demain';
  else quand = 'dans ' + x.jours + ' j';

  let h = '<div class="row ' + n + '">';
  h += '<div class="l1"><span class="so">' + esc(x.so) + '</span>';
  if (x.client) h += '<span class="sep">·</span><span class="cli">' + esc(x.client) + '</span>';
  h += '<span class="badge b-' + n + '">' + (x.date_arc ? 'ARC ' + frDate(x.date_arc) + ' — ' : '') + quand + '</span></div>';

  h += '<div class="l2"><span class="pastille p-' + (x.type === 'AF' ? 'bleu' : x.type === 'MODIF' ? 'orange' : 'vert') + '">'
     + esc(x.type) + '</span>';

  // Ce qui aide à décider quoi prendre : la carte, puis ce que la prod a déjà posé.
  const bouts = [];
  if (x.carte) bouts.push(court(x.carte, 42));
  if (x.my) bouts.push('MY le ' + frDate(x.my));
  else if (x.tr) bouts.push('TRAD le ' + frDate(x.tr));
  if (x.date_recept_cpts) bouts.push('cpts ' + esc(x.date_recept_cpts));
  h += '<span class="quoi">' + bouts.join(' · ') + '</span>';

  h += '<span class="acts">';
  if (x.lien_fabstory) h += '<a class="btn-s" target="_blank" rel="noopener" href="' + esc(x.lien_fabstory) + '">FabStory</a>';
  if (x.lien_luminovo) h += '<a class="btn-s" target="_blank" rel="noopener" href="' + esc(x.lien_luminovo) + '">Luminovo</a>';
  if (x.lien_projet)   h += '<a class="btn-s" target="_blank" rel="noopener" href="' + esc(x.lien_projet) + '">Odoo</a>';
  h += '</span></div></div>';
  return h;
}

/* ---------- v1.35 : LES AFFAIRES EN SOURDINE ---------- *
 * D où ça vient (04/11/2026). Maura, sur IP2I SO2609-516 : « une question existe, on attend
 * la réponse du client, mais je peux pas te dire d arrêter de faire sonner cette alerte ».
 *
 * La sourdine EXISTAIT pourtant depuis septembre — table ecarts_assumes. Mais elle n était
 * posable que par un lien du mail du matin, elle ne disait ni qui l avait posée ni pourquoi
 * de façon exploitable, et une fois posée l affaire disparaissait sans laisser de trace à
 * l écran : impossible de la réveiller. Elle a servi TROIS fois en deux mois.
 *
 * Ce que la v1.35 ajoute, décidé par Olivier le 04/11/2026 :
 *   JUSTIFICATION OBLIGATOIRE  un motif choisi dans une liste ET une précision en clair.
 *                              La liste pour compter plus tard pourquoi les lignes dorment,
 *                              le texte pour dire le cas précis. L un sans l autre ne suffit
 *                              pas : un texte libre seul n est comptable par personne.
 *   QUI                        posée par le responsable de la ligne, Olivier sur toutes.
 *   RÉVEIL                     à la réponse du client, à J+X, ou à la main.
 *                              Pas de réveil forcé automatique.
 *   VISIBILITÉ                 un bloc gris en bas de page et une pastille dans l équaliseur.
 *
 * La page n écrit pas en base elle-même : ecarts_assumes est protégée et n accepte pas la clé
 * publique. Tout passe par le workflow, qui revérifie le motif et la précision — un contrôle
 * d écran seul se contourne en rechargeant la page.
 *
 * v1.35 garde la granularité par AFFAIRE. La sourdine par LIGNE affichée, voulue par Olivier,
 * attend la v1.36 : elle demande de toucher v_appro_a_traiter, partagée avec le filet qualité
 * et le mail du matin.
 * ------------------------------------------------------------------ */
const MOTIFS_SOURDINE = [
  ['question_client',   'Question client en attente'],
  ['ar_fournisseur',    'Attente AR ou date fournisseur'],
  ['ref_sans_solution', 'Réf. indisponible sans solution'],
  ['fourniture_client', 'Attente fourniture client'],
  ['decision_interne',  'Attente décision interne'],
  ['autre',             'Autre']
];
const LIB_SOURDINE = {};
MOTIFS_SOURDINE.forEach(m => { LIB_SOURDINE[m[0]] = m[1]; });

let SOURDINES = null;
let SD_CTX = null;

/* Lecture directe de Supabase, et pas du service : une affaire en sourdine a justement
   disparu de ce que le service rend. Sans cette lecture-là, elle serait invisible. */
async function chargerSourdines() {
  const z = document.getElementById('bloc-sourdine');
  if (!z) return;
  try {
    const r = await fetch(SB_URL + '/v_sourdines_actives?select=*', { headers: { apikey: SB_KEY } });
    SOURDINES = r.ok ? (await r.json() || []) : [];
  } catch (e) { SOURDINES = []; }
  const l = mesSourdines();
  z.innerHTML = l.length ? blocSourdine(l) : '';
  z.style.display = l.length ? '' : 'none';
  majCharge();
}

/* Même porte que le reste de la page : chacun voit les siennes, la direction voit tout.
   On retient aussi celles qu on a posées soi-même sur l affaire d un autre — sinon on perd
   de vue un silence qu on a demandé. */
function mesSourdines() {
  const l = SOURDINES || [];
  if (!MOI) return [];
  if (POLE_DE[MOI] === 'direction') return l;
  return l.filter(s => s.responsable === MOI || s.pose_par === MOI);
}

function blocSourdine(l) {
  let h = '<div class="shead t-gris" onclick="plierBloc(this)" title="Replier ce bloc">';
  h += '<h2>EN SOURDINE</h2>';
  h += '<span class="cpt c-gris">' + l.length + '</span></div>';
  h += '<div class="msg">Ces affaires ne remontent plus dans les blocs du dessus. '
     + 'Elles reviennent d elles-mêmes à leur échéance — ou tout de suite si tu les réveilles.</div>';
  h += l.map(ligneSourdine).join('');
  return h;
}

function ligneSourdine(s) {
  const j = Number(s.jours_restants);
  const quand = j <= 0 ? 'revient demain'
              : j === 1 ? 'revient demain'
              : 'revient dans ' + j + ' jours';
  let h = '<div class="row gris" id="sd-' + esc(s.so) + '">';
  h += '<div class="l1"><span class="so">' + esc(s.so) + '</span>';
  if (s.client) h += '<span class="sep">·</span><span class="cli">' + esc(s.client) + '</span>';
  if (s.carte) h += '<span class="sep">·</span><span class="cli">' + esc(s.carte) + '</span>';
  h += '<span class="badge b-gris">' + esc(quand) + '</span></div>';

  h += '<div class="l2">';
  // Le motif codifié en pastille, la précision en clair à côté : on lit la catégorie d un
  // coup d oeil, et le cas précis sans avoir à déplier.
  h += '<span class="pastille p-gris">'
     + esc(LIB_SOURDINE[s.motif_code] || 'posée avant la v1.35') + '</span>';
  const par = s.pose_par ? ' — ' + esc(nomDe(s.pose_par) || s.pose_par) : '';
  h += '<span class="quoi">' + esc(s.detail || s.motif || '') + par + '</span>';
  h += '<span class="acts">';
  h += '<button class="btn-s" onclick="reveiller(\'' + esc(s.so) + '\')">Réveiller</button>';
  h += '</span></div></div>';
  return h;
}

/* ---- poser ---- */
function ouvrirSourdine(ctx) {
  SD_CTX = typeof ctx === 'string' ? JSON.parse(ctx) : (ctx || {});
  fermerSourdine();
  const a = SD_CTX;
  let h = '<div class="mfond" id="m-sourdine" onclick="if(event.target===this)fermerSourdine()">';
  h += '<div class="mbox">';
  h += '<h3>Mettre en sourdine</h3>';
  h += '<p class="msub">' + esc(a.so) + (a.client ? ' — ' + esc(a.client) : '') + '</p>';
  h += '<p class="maide">Cette affaire cessera de remonter dans tes blocs. Dis pourquoi : '
     + 'le motif servira à savoir, plus tard, ce qui fait dormir les lignes.</p>';
  h += '<label for="sd-motif">Motif</label>';
  h += '<select id="sd-motif"><option value="">— choisir —</option>'
     + MOTIFS_SOURDINE.map(m => '<option value="' + m[0] + '">' + m[1] + '</option>').join('')
     + '</select>';
  h += '<label for="sd-detail">Précision</label>';
  h += '<textarea id="sd-detail" placeholder="Ce qu on attend exactement, et de qui."></textarea>';
  h += '<label for="sd-jours">Elle revient</label>';
  h += '<select id="sd-jours">'
     + '<option value="3">dans 3 jours</option>'
     + '<option value="5" selected>dans 5 jours</option>'
     + '<option value="7">dans 7 jours</option>'
     + '<option value="14">dans 14 jours</option></select>';
  h += '<div class="merr" id="sd-err"></div>';
  h += '<div class="macts">';
  h += '<button class="btn-s" onclick="fermerSourdine()">Annuler</button>';
  h += '<button class="btn-p" id="sd-ok" onclick="poserSourdine()">Mettre en sourdine</button>';
  h += '</div></div></div>';
  const d = document.createElement('div');
  d.innerHTML = h;
  document.body.appendChild(d.firstChild);
  const m = document.getElementById('sd-motif');
  if (m) m.focus();
}

function fermerSourdine() {
  const m = document.getElementById('m-sourdine');
  if (m) m.remove();
}

async function poserSourdine() {
  const a = SD_CTX || {};
  const motif_code = (document.getElementById('sd-motif') || {}).value || '';
  const detail = ((document.getElementById('sd-detail') || {}).value || '').trim();
  const jours = Number((document.getElementById('sd-jours') || {}).value || 5);
  const err = document.getElementById('sd-err');
  // Les deux champs sont exigés ici ET dans le workflow : ici pour le dire tout de suite,
  // là-bas parce que c est le seul contrôle qu on ne peut pas contourner.
  if (!motif_code) { err.textContent = 'Choisis un motif.'; return; }
  if (detail.length < 3) { err.textContent = 'Écris une précision : ce qu on attend, et de qui.'; return; }
  const b = document.getElementById('sd-ok');
  b.disabled = true;
  b.textContent = 'Enregistrement…';
  err.textContent = '';
  try {
    const r = await fetch(SOURDINE_BORD, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'poser', so: a.so, qui: MOI,
        motif_code: motif_code, detail: detail, jours: jours,
        responsable: a.responsable || MOI, client: a.client || '',
        carte: a.carte || '', libelle: a.libelle || ''
      })
    });
    if (!r.ok) throw new Error('réponse ' + r.status);
    const rep = await r.json();
    if (!rep.ok) throw new Error(rep.motif || 'refusé');
    fermerSourdine();
    toast('En sourdine. Elle revient le ' + frDate(rep.jusqu_au) + '.');
    const ligne = document.getElementById('aff-' + a.so);
    if (ligne) ligne.classList.add('parti');
    setTimeout(rafraichir, 500);
  } catch (e) {
    b.disabled = false;
    b.textContent = 'Mettre en sourdine';
    err.textContent = 'Ça n a pas été enregistré (' + e.message + ').';
  }
}

/* ---- réveiller ---- */
async function reveiller(so) {
  const ligne = document.getElementById('sd-' + so);
  try {
    const r = await fetch(SOURDINE_BORD, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'reveiller', so: so, qui: MOI })
    });
    if (!r.ok) throw new Error('réponse ' + r.status);
    const rep = await r.json();
    if (!rep.ok) throw new Error(rep.motif || 'refusé');
    toast('Réveillée. L affaire revient dans tes blocs.');
    if (ligne) ligne.classList.add('parti');
    setTimeout(rafraichir, 500);
  } catch (e) {
    toast('Le réveil n a pas abouti (' + e.message + ').');
  }
}

/* ---------- demandes de prix à prendre ---------- *
 * D où ça vient (03/11/2026). OCTOPUCES, nouveau prospect, écrit le vendredi 30/10 à 16h01.
 * Le mardi suivant, personne ne l avait ouvert. Enquête : la demande portait l étiquette
 * ->Devis mais AUCUN responsable, et le bloc « mes devis à traiter » filtre par responsable.
 * Elle n était donc sur le tableau de PERSONNE. Même cause pour MILLIADES, 20 jours.
 *
 * Deuxième cause, aussi vérifiée : l ancien seuil était de DEUX JOURS OUVRÉS sans lecture.
 * Avec un objectif de réponse à 24/48 h, l alerte arrivait quand le délai était déjà brûlé.
 *
 * La règle, décidée par Olivier le 03/11/2026 :
 *   sans responsable   visible chez TOUS les commerciaux et la direction
 *                      neutre à l arrivée, ROUGE après 1 jour ouvré
 *   avec responsable   visible chez LUI seul, ambre à 1 jour ouvré, rouge à 2
 *   en sourdine        gris et hors alerte, MAIS rouge à 10 jours sans réponse client —
 *                      une sourdine ne doit pas pouvoir servir à enterrer un dossier
 *
 * Le bouton « Je la prends » est le coeur du bloc. Sans lui, une ligne rouge affichée chez
 * quatre personnes reste le travail de personne. Il pose l étiquette nominative dans Gmail
 * et la ligne quitte le commun pour arriver chez celui qui a cliqué.
 *
 * Il ne marque JAMAIS le fil lu : un mail lu est un mail traité (règle Olivier), le marquer
 * lu ferait disparaître la demande de toutes les listes alors que rien n a commencé.
 *
 * Les seuils et les niveaux sont calculés dans le workflow, pas ici : c est une règle métier,
 * elle se change à un seul endroit.
 * ------------------------------------------------------------------ */
const DEMANDES        = 'https://protoprocess.app.n8n.cloud/webhook/pp-devis-a-prendre';
const DEMANDE_PRENDRE = 'https://protoprocess.app.n8n.cloud/webhook/pp-devis-je-la-prends';

// Les couleurs du service parlent métier (ambre / neutre) ; la feuille de style parle
// en orange / bleu. On traduit ici plutôt que de renommer l un des deux.
const NIVEAU_CSS = { rouge: 'rouge', ambre: 'orange', neutre: 'bleu', gris: 'gris' };

function voitLesDemandesDePrix() {
  const p = POLE_DE[MOI];
  return p === 'direction' || p === 'commercial_achats';
}

async function chargerDemandes() {
  const z = document.getElementById('bloc-demandes');
  if (!z) return;
  z.innerHTML = '<div class="msg"><i class="ti ti-loader"></i> Lecture de la boîte commerciale…</div>';
  try {
    const r = await fetch(DEMANDES, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ source: 'tableau-de-bord', version: APP_VERSION, qui: MOI }) });
    if (!r.ok) throw new Error('réponse ' + r.status);
    z.innerHTML = blocDemandes(await r.json());
  } catch (e) {
    z.innerHTML = '<div class="msg err">Les demandes de prix n ont pas pu être lues (' + esc(e.message)
                + '). Le reste de la page est à jour.</div>';
  }
}

function blocDemandes(d) {
  const toutes = (d && d.lignes) || [];
  // v1.28 (03/11/2026, demande d Olivier) : le bloc ne garde QUE les demandes sans
  // responsable. « À prendre » veut dire à prendre : une demande déjà attribuée n est plus
  // à prendre par personne, et elle figurait en double avec « mes devis à traiter ».
  const l = toutes.filter(x => x.sans_responsable);
  const rouges = l.filter(x => x.niveau === 'rouge').length;

  let h = entete(rouges ? 't-crit' : 't-ok', '', 'DEMANDES DE PRIX À PRENDRE', l.length, '');
  // v1.24 : l écran comptait seulement ce qui RESTE, ce qui donne « l impression de couler ».
  // Ce qui est sorti cette semaine se lit à côté, et change complètement la lecture.
  // Le compteur est indexé par PRÉNOM : c est ce que la mesure de déroulé enregistre.
  const moiNom = (DONNEES.find(x => x.initiales === MOI) || {}).nom || '';
  const faites = ((d && d.terminees_semaine) || {})[moiNom] || 0;
  // v1.27 : la tolérance ne vaut QUE pour un RFQ PCB, c est-à-dire un dossier qui demande
  // une consultation fabricant. Un PCB standard se chiffre dans les délais normaux.
  // v1.30 : phrase raccourcie (Olivier, 03/11 au soir). Elle tenait sur trois lignes en
  // haut du bloc et repoussait les demandes elles-memes hors de vue : c est un rappel,
  // pas une procedure.
  h += '<div class="msg">Objectif : <b>devis sous 24/48 h</b>, sauf RFQ PCB (<b>72/96 h</b>).'
     + (faites ? ' <b>' + faites + '</b> devis terminé' + (faites > 1 ? 's' : '') + ' cette semaine.' : '')
     + '</div>';
  if (!l.length) {
    h += '<div class="vide"><i class="ti ti-circle-check"></i> Aucune demande en attente.</div>';
    return h;
  }
  h += capper(l.map(ligneDemande), 'demande');
  return h;
}

function ligneDemande(x) {
  const n = NIVEAU_CSS[x.niveau] || 'gris';
  // Le badge dit l âge de l attente. « reçu le » reste affiché à côté : sur un fil relancé
  // par le client, le compteur repart de la relance et masquerait l ancienneté réelle.
  const quand = x.jours <= 0 ? "aujourd hui" : (x.jours === 1 ? 'depuis hier' : 'depuis ' + x.jours + ' j');

  let h = '<div class="row ' + n + '" id="dp-' + esc(x.thread_id) + '">';
  h += '<div class="l1"><span class="so">' + esc(court(x.objet, 48)) + '</span>';
  if (x.client) h += '<span class="sep">·</span><span class="cli">' + esc(x.client) + '</span>';
