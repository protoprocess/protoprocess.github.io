<title>Mon tableau de bord — nouvelle adresse</title>
<!-- ==================================================================
     ATTENTION — CE FICHIER N EST PLUS LA PAGE.

     Le 02/11/2026 au soir, « Mon tableau de bord » a quitte /ma-gestion/
     pour la RACINE du site, ou il remplace l ancien hub d accueil.

         la page vraie :  protoprocess.github.io/index.html
         ce fichier     :  une simple redirection, rien d autre

     Toute modification du tableau de bord se fait dans index.html A LA
     RACINE du depot. Modifier ce fichier-ci ne change rien pour personne.

     Pourquoi la redirection et pas une suppression : le mail du point du
     matin de 7h30 pointe sur /ma-gestion/?j=<jeton> depuis ce matin, et
     des gens ont pu mettre l adresse en favori dans la journee. Les
     parametres de l URL (?j= et ?qui=) sont donc reportes tels quels.
     ================================================================== -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://protoprocess.github.io/">
<script>
/* On reporte la query ET le fragment : le jeton du mail est dans ?j=, et la page
   d arrivee sait le lire. Sans ce report, un clic depuis le mail du matin perdrait
   l identite et demanderait « qui es-tu ? » a quelqu un qu on connaissait. */
location.replace('https://protoprocess.github.io/' + location.search + location.hash);
</script>
